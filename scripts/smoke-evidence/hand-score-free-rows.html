<style>
  :root{--ink:#2b2420;--paper:#f6f1e7;--card:#fffdf8;--line:#d9cfbf;--act:#8a2f1f;--ign:#6b6150;--wrong:#1f4f8a;--muted:#7a6f62}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Georgia,"Iowan Old Style",serif}
  header{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  header b{font-size:17px} .tally span{display:inline-block;margin-right:12px} .tally .a{color:var(--act)} .tally .w{color:var(--wrong)}
  main{max-width:860px;margin:18px auto;padding:0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap} .kind{border:1px solid var(--line);border-radius:10px;padding:0 8px}
  .kind.free{border-color:var(--act);color:var(--act)}
  h2{margin:8px 0 10px;font-size:20px} .row{background:#f1eadc;border-left:3px solid var(--line);padding:10px 12px;margin:8px 0;font-size:14.5px}
  .issue{margin:12px 0 4px} .issue:before{content:"the audit says: ";color:var(--muted);font-style:italic}
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap} button{font:inherit;padding:9px 16px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.act{border-color:var(--act);color:var(--act)} button.ign{color:var(--ign)} button.wrong{border-color:var(--wrong);color:var(--wrong)} button.on{color:#fff}
  button.act.on{background:var(--act)} button.ign.on{background:var(--ign)} button.wrong.on{background:var(--wrong)}
  .nav{margin-left:auto;display:flex;gap:8px} kbd{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:#fff;color:var(--muted)}
  textarea#md{width:100%;height:220px;margin-top:14px;font:12.5px ui-monospace,Menlo,monospace;display:none}
  textarea.note{width:100%;box-sizing:border-box;min-height:58px;margin-top:12px;padding:8px 10px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:5px;background:#fff;resize:vertical}

<script>
const ITEMS=[{"id":"gate-retaliate-2026-11-11T19-19-28/04-cinder-brute.md/Molten Recoil/102","run":"gate-retaliate-2026-11-11T19-19-28","sheet":"Cinder Brute","cr":"6","sec":"Reactions","row":"Molten Recoil","kind":"free row","text":"*Trigger:* A creature within reach hits the cinder brute with a melee attack. *Response:* The brute's crust splits and sprays a gout of clinging magma at the attacker, which must make a Dexterity saving throw (DC 14); on a failure it is Restrained by cooling slag, and it can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.","issue":"Save DC is given but the trigger's timing is only implicit; more critically, the reaction names no energy type for the magma despite it being 'molten' — the effect deals no damage and applies no fire, so the medium is undefined beyond the Restrained rider."},{"id":"gate-b-engulf-2026-11-10T20-10-11/06-rivergrip-lurker.md/Still Beneath the Silt/4","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Rivergrip Lurker","cr":"2","sec":"Traits","row":"Still Beneath the Silt","kind":"free row","text":"While the lurker remains motionless in water and has not yet attacked, or while it has a creature Grappled with its Jaws in water, a creature that has not yet seen the lurker move must succeed on a Wisdom (Perception) check against DC 13 to notice it before it strikes, and a creature Grappled by the lurker's Jaws in water is pulled under and must hold its breath or begin suffocating until it is no longer Grappled.","issue":"The trait silently assumes a 'silt' substrate that its own rules never require (any water triggers it), creating a name/content mismatch with the trait's premise."},{"id":"gate-c1-2026-11-10T07-24-12/03-granite-ancestor.md/Sunken Blow/33","run":"gate-c1-2026-11-10T07-24-12","sheet":"Granite Ancestor","cr":"10","sec":"Actions","row":"Sunken Blow","kind":"free row","text":"*Strength Saving Throw*: DC 17, each creature within 10 feet. *Failure:* The target has the Prone condition.","issue":"A Strength save to resist being knocked Prone is a static-force / body-mass check, which fits, but the name and placement suggest a targeted strike rather than an area effect; the stat-entry-fiction is mismatched for the claimed overhead maul feature."},{"id":"gate-h-hold-2026-11-11T20-20-08/09-sand-maw.md/Rolling Breach/89","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Sand-Maw","cr":"9","sec":"Actions","row":"Rolling Breach (Recharge 5-6)","kind":"free row","text":"*Dexterity Saving Throw*: DC 15, each creature in a 30-foot Line. *Failure:* 45 (13d6) Bludgeoning damage, and the target has the Prone condition.","issue":"Missing preposition/verb structure leaves the target clause ungrammatical."},{"id":"gate-h-hold-2026-11-11T05-22-56/05-ford-bend-maw.md/Undertow Lunge/52","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Ford-Bend Maw","cr":"2","sec":"Actions","row":"Undertow Lunge","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 10 feet straight toward the maw, and the target has the Prone condition.","issue":"The pull is 'up to 10 feet straight toward' a direction that depends on the maw's position relative to each target in the cone; with multiple creatures in a 15-foot cone at varying angles, the GM must adjudicate per-target vectors and stop positions, which is fiddly mid-combat."},{"id":"sweep-2026-11-10T15-02-59/04-funeral-bell-wraith.md/Last Breath, Tolled Home/127","run":"sweep-2026-11-10T15-02-59","sheet":"Funeral Bell Wraith","cr":"3","sec":"Traits","row":"Last Breath, Tolled Home","kind":"free row","text":"When the bell wraith reduces a creature to 0 Hit Points, the dying creature's final breath tolls like a struck bell, and the bell wraith regains 6 (1d12) Hit Points; while a creature is below half its Hit Points, the bell wraith has Advantage on Wisdom (Perception) checks to hear it.","issue":"The trait is a single named trait bundling two unrelated mechanics (death-trigger heal and hearing advantage); the hearing clause creates an ongoing tracking state the GM must monitor without a clear condition of which creature."},{"id":"gate-b-engulf-2026-11-10T20-31-09/07-drowned-lure-eel.md/Drag Below/17","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Drowned Lure Eel","cr":"3","sec":"Actions","row":"Drag Below","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 10 feet straight toward the lure eel, and the target has the Prone condition.","issue":"Straight-line pull toward the eel is direction-ambiguous for a 15-foot cone and can produce nonadjacent placement, leaving the GM unable to resolve the forced movement."},{"id":"gate-h-hold-2026-11-11T15-25-20/10-gullet-ledge-roper.md/Stonefoot Anchor/68","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Gullet Ledge Roper","cr":"5","sec":"Traits","row":"Stonefoot Anchor","kind":"free row","text":"While the ledge roper is anchored to stone, the ledge roper climbs sheer stone without an ability check, and it cannot be moved against its will by any effect that would push, pull, or knock it from its perch.","issue":"The name 'Stonefoot Anchor' promises a rooting/anchoring mechanic, but its rules only grant climbing and push-immunity; nothing anchors it or prevents forced movement via Reel-style pull effects on itself, so the name overpromises."},{"id":"gate-h-hold-2026-11-11T15-25-20/06-drowned-maw.md/Weed-Shadow Ambush/64","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Drowned Maw","cr":"3","sec":"Reactions","row":"Weed-Shadow Ambush","kind":"free row","text":"*Trigger:* A creature moves within 5 feet of Maw while Maw is submerged in water or weed-shadow and hidden, holding perfectly still with only its eyes and hooked jaw showing. *Response:* Maw makes one Bite attack against that creature, and on a hit the target is pulled up to 5 feet straight toward Maw.","issue":"The trait bundles stealth-narration, a movement trigger, and a bite into one run-on with no clear resolution order — hard to adjudicate mid-combat."},{"id":"gate-h-hold-2026-11-11T05-44-38/10-cave-roper.md/Wall Anchored/59","run":"gate-h-hold-2026-11-11T05-44-38","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Wall Anchored","kind":"free row","text":"While anchored to a wall, the cave roper can use a Bonus Action to pull a Grappled creature it can see within its reach directly toward its maw; when a creature enters a space within 5 feet of its hide using its own movement, it must succeed on a DC 14 save or have the Prone condition until it spends movement to stand.","issue":"The Prone imposition is automatic with no save and no distance the creature can avoid; a creature without movement available to stand remains Prone indefinitely with no rules path out on that turn."},{"id":"gate-type-2026-11-10T18-56-12/06-altar-vigil.md/Emptied Temple/116","run":"gate-type-2026-11-10T18-56-12","sheet":"Altar Vigil","cr":"6","sec":"Traits","row":"Emptied Temple","kind":"free row","text":"At the start of each of the vigil's turns, if it is Bloodied or a creature it can see has been reduced to 0 Hit Points since its last turn, the vigil regains 11 (2d10) Hit Points and has Advantage on its next attack roll.","issue":"The heal value is stated as 11 (2d10), but 2d10 averages 11; however, the phrasing \"11 (2d10)\" is the standard dice-average parenthetical, so this is not a defect. The real concern is that the trait has no cap or usage limit, allowing infinite healing when the condition triggers every turn."},{"id":"gate-b-engulf-2026-11-10T19-44-57/05-silt-maw.md/Mud-Dragging Lunge/1","run":"gate-b-engulf-2026-11-10T19-44-57","sheet":"Silt Maw","cr":"1","sec":"Actions","row":"Mud-Dragging Lunge","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 10 feet straight toward the silt maw, and the target has the Prone condition.","issue":"The cone's origin/placement is unspecified (no statement it originates from the silt maw), leaving the GM unable to determine which creatures are targeted."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/86","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The statblock refers to itself as 'the widow' and 'she' rather than by its own entry name, an inconsistent referent."},{"id":"gate-b-engulf-2026-11-10T19-44-57/09-drowned-kelpie.md/Adhesive/3","run":"gate-b-engulf-2026-11-10T19-44-57","sheet":"Drowned Kelpie","cr":"4","sec":"Traits","row":"Adhesive","kind":"free row","text":"When the drowned kelpie hits a Huge or smaller creature with Hooves, the target is Grappled by the drowned kelpie (escape DC 14), ability checks to escape have Disadvantage, and a grappled creature can use its action to tear itself free and end the grapple.","issue":"The trait mandates Disadvantage on the escape check but never names which check (Strength (Athletics) or Dexterity (Acrobatics)), leaving the GM to guess what the creature rolls at Disadvantage."},{"id":"gate-c1-2026-11-10T07-24-12/10-displacer-stalker.md/Tentacles/38","run":"gate-c1-2026-11-10T07-24-12","sheet":"Displacer Stalker","cr":"3","sec":"Actions","row":"Tentacles","kind":"authored","text":"*Melee Attack Roll:* +5 (with Advantage during the first round of each combat), reach 5 ft. 7 (1d8 + 3) Bludgeoning damage plus 5 (1d10) Psychic damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 11). If the target already has the Grappled condition, the Grappled condition on the target lasts until the end of the stalker's next turn.","issue":"The clause affixes an end-time to a Grappled condition that otherwise carries its own escape (DC 11) and can only be reached by hitting an already-Grappled target, but the reach 5 ft. single-target structure means the second clause never overrides the escape DC in a way a GM can reconcile mid-turn."},{"id":"gate-b-engulf-2026-11-10T20-20-36/02-tar-cistern-sludge.md/Gullet of Tar/10","run":"gate-b-engulf-2026-11-10T20-20-36","sheet":"Tar Cistern Sludge","cr":"3","sec":"Actions","row":"Gullet of Tar (Recharge 5-6)","kind":"free row","text":"*Dexterity Saving Throw*: DC 13, one creature within 15 feet. *Failure:* 24 (7d6) Acid damage, and the target is pulled up to 5 feet straight toward the sludge, and the target has the Restrained condition until the end of its next turn.","issue":"The forced movement direction ('straight toward') is undefined relative to the target's position and has no basis for a pull — it should be defined as toward the sludge without ambiguity."},{"id":"sweep-2026-11-10T15-02-59/04-funeral-bell-wraith.md/Deathwatch Toll/126","run":"sweep-2026-11-10T15-02-59","sheet":"Funeral Bell Wraith","cr":"3","sec":"Actions","row":"Deathwatch Toll","kind":"free row","text":"*Wisdom Saving Throw*: DC 13, one creature within 60 feet. *Failure:* 13 (3d8) Psychic damage.","issue":"The name promises a death-watch effect (marking or harming the dying), but the entry is a plain psychic-damage save with no death or dying mechanic."},{"id":"gate-h-hold-2026-11-11T17-08-23/12-brine-coil.md/Grasping Tentacles/75","run":"gate-h-hold-2026-11-11T17-08-23","sheet":"Brine Coil","cr":"6","sec":"Actions","row":"Grasping Tentacles","kind":"authored","text":"*Melee Attack Roll:* +7, reach 5 ft. 13 (2d8 + 4) Bludgeoning damage plus 7 (2d6) Cold damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 15). If the coil moved at least 20 feet straight toward the target immediately before the hit and the target is Large or smaller, the target has the Prone condition, and the coil can make one Grasping Tentacles attack against it as a Bonus Action.","issue":"The Bonus Action follow-up is triggered off a hit but the trigger clause has no duration or end condition tying the held state, and the Grappled-escape from the same hit doesn't govern the Prone follow-up, so the GM cannot tell whether a creature that escaped the grapple can still be struck by the granted Bonus Action."},{"id":"gate-h-hold-2026-11-11T22-13-22/01-cave-roper.md/Ceiling Lurk/92","run":"gate-h-hold-2026-11-11T22-13-22","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Ceiling Lurk","kind":"free row","text":"When the roper hits a creature with a Bite attack while hanging from a ceiling or cliff, the target has the Grappled condition (escape DC 15) and is pulled up to 10 feet straight toward the roper; the grapple ends when the target escapes with a successful Strength (Athletics) or Dexterity (Acrobatics) check against the DC.","issue":"The trait bundles a climb benefit, a Bite-triggered pull, and an undefined grapple into one conditional clause requiring the GM to track the anchored state."},{"id":"gate-retaliate-2026-11-11T19-19-28/03-vess-ardaine.md/Iron-Bound Blade/101","run":"gate-retaliate-2026-11-11T19-19-28","sheet":"Vess Ardaine","cr":"5","sec":"Traits","row":"Iron-Bound Blade","kind":"free row","text":"When Vess would be reduced to 0 Hit Points, the rapier shatters and Vess instead drops to 1 Hit Point; it reforms when she completes a Short Rest.","issue":"The GM must track the depleted 'shattered' state across multiple encounters (before a Short Rest), with no reminder mechanic beyond the trait text; while minor, the short-rest recovery is a state the block gives no tracking hook for."},{"id":"gate-c1-2026-11-10T05-19-21/03-ledger-hulk.md/Slag Grind/30","run":"gate-c1-2026-11-10T05-19-21","sheet":"Ledger Hulk","cr":"10","sec":"Actions","row":"Slag Grind","kind":"free row","text":"*Strength Saving Throw*: DC 17, one creature within 10 feet. *Failure:* The target has the Grappled condition (escape DC 17).","issue":"The grapple has an escape DC but no size restriction, so as written the hulk can grapple any creature, including Huge and Gargantuan ones it could not plausibly grip."},{"id":"gate-h-hold-2026-11-11T22-40-27/10-cave-roper.md/Stone Anchor/97","run":"gate-h-hold-2026-11-11T22-40-27","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Stone Anchor","kind":"free row","text":"While the cave roper is anchored to a ceiling or rocky shelf it clings to, the cave roper cannot be moved against its will, and a creature it has Grappled cannot be moved away from it by any means short of teleportation.","issue":"The trait promises to prevent moving a grappled creature by any means short of teleportation, but the block provides no rules for releasing or breaking the anchoring hold beyond the escape DC, making the trait's scope adjudication-dependent and potentially contradicting forced movement effects the block does not address."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/84","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The entry opens with a dangling 'When...' trigger that governs no consequence, yet it also asserts two unconditional activities (treating difficult ground as open ground, leaving no tracks), so the GM cannot tell what the trigger actually gates."},{"id":"gate-h-hold-2026-11-11T05-22-56/09-sunken-road-maw.md/Maw of the Hollow Road/53","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Sunken Road Maw","cr":"9","sec":"Actions","row":"Maw of the Hollow Road","kind":"free row","text":"*Strength Saving Throw*: DC 15, each creature in a 30-foot Cone. *Failure:* The target is pulled up to 20 feet straight toward the maw, and the target has the Prone condition.","issue":"The name 'Maw of the Hollow Road' promises a bite/deglutition mechanic, but the entry only pulls and knocks Prone — the maw's mouth never features in the effect."},{"id":"gate-retaliate-2026-11-11T19-19-28/03-vess-ardaine.md/Iron-Bound Blade/100","run":"gate-retaliate-2026-11-11T19-19-28","sheet":"Vess Ardaine","cr":"5","sec":"Traits","row":"Iron-Bound Blade","kind":"free row","text":"When Vess would be reduced to 0 Hit Points, the rapier shatters and Vess instead drops to 1 Hit Point; it reforms when she completes a Short Rest.","issue":"The trait's name and text promise a blade mechanic, but the effect triggers on Vess being reduced to 0 HP—the rapier is never referenced as the source of the trigger, and there is no stated consequence if the blade is somehow already broken or lost."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/85","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The trait depends on a trackable spatial state ('the wet ground she passed through') that the block gives the GM no way to define, mark, or persist across turns."},{"id":"gate-b-engulf-2026-11-10T21-29-43/01-drowned-coil-eel.md/Drag Below/20","run":"gate-b-engulf-2026-11-10T21-29-43","sheet":"Drowned Coil Eel","cr":"3","sec":"Actions","row":"Drag Below","kind":"free row","text":"*Strength Saving Throw*: DC 13, one creature within 5 feet. *Failure:* The target is pulled up to 5 feet straight toward the coil eel, and the target has the Restrained condition until the end of its next turn.","issue":"Moving a target directly toward the eel is not adjudicable when the target occupies a space adjacent to it as required by the 5-foot range; no destination is definable."},{"id":"gate-b-engulf-2026-11-10T20-31-09/03-gorgebellied-marshfrog.md/Setting Slime/14","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Gorgebellied Marshfrog","cr":"1","sec":"Traits","row":"Setting Slime","kind":"free row","text":"When a creature ends its turn still Grappled or Restrained by the marshfrog, the creature's Speed is reduced by 10 feet until the end of its next turn as the drying slime stiffens on its limbs.","issue":"The speed reduction triggers on a creature still Grappled or Restrained at end of turn, but Restrained creatures already have Speed 0; applying it while grappled has no duration anchor if the grapple ends immediately after — the effect's end timing is keyed to 'its next turn' but the source condition may already be gone, leaving an untracked speed penalty."},{"id":"sweep-2026-11-10T15-02-59/24-sump-scythe-horror.md/Corrosive Runoff/135","run":"sweep-2026-11-10T15-02-59","sheet":"Sump Scythe Horror","cr":"9","sec":"Traits","row":"Corrosive Runoff","kind":"free row","text":"At the start of each of the scythe horror's turns, each creature Grappled by the scythe horror or grappling it, and the scythe horror itself, takes 16 (3d10) Acid damage.","issue":"The trait's own name and the self-damage clause are mechanically contradictory: the horror deals itself Acid damage every turn with no immunity or resistance stated, so a GM running the block deals damage to the horror that the fiction ('corrosive runoff') does not justify."},{"id":"gate-b-engulf-2026-11-10T20-31-09/06-scarreled-deathroll.md/Drowning Drag/15","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Scarreled Deathroll","cr":"2","sec":"Actions","row":"Drowning Drag","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 15 feet straight toward Deathroll.","issue":"The name promises drowning/pulling underwater, but the text only pulls a target 15 feet toward the creature with no water, drowning, or suffocation mechanic."},{"id":"gate-b-engulf-2026-11-10T20-10-11/07-sunken-hold-eel.md/Drowning Coil/6","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Sunken Hold Eel","cr":"3","sec":"Bonus Actions","row":"Drowning Coil","kind":"free row","text":"*Constitution Saving Throw*: DC 13, one creature within 5 feet. *Failure:* 13 (3d8) Bludgeoning damage.","issue":"The saving throw has no trigger or timing stated, and dealing Bludgeoning damage with the name 'Drowning' implies suffocation/flavor it never delivers, but the real defect is the missing trigger — a GM cannot tell when this bonus action is invoked relative to the grapple."},{"id":"gate-b-engulf-2026-11-10T21-33-18/01-drowned-larder-crocodile.md/Jaws Lock/22","run":"gate-b-engulf-2026-11-10T21-33-18","sheet":"Drowned Larder Crocodile","cr":"2","sec":"Actions","row":"Jaws Lock","kind":"free row","text":"*Strength Saving Throw*: DC 13, one creature within 5 feet. *Failure:* The target is pulled up to 5 feet straight toward the larder crocodile, and the target has the Grappled condition (escape DC 13).","issue":"Jaws Lock is described as seizing and dragging a creature, but the forced movement is toward the crocodile rather than away/down — the pull direction contradicts the 'lock' fiction and duplicates Bite's grapple without adding the drag it promises."},{"id":"gate-savefit-2026-11-10T15-28-09/01-tar-creeper.md/Burning Slick/104","run":"gate-savefit-2026-11-10T15-28-09","sheet":"Tar Creeper","cr":"4","sec":"Traits","row":"Burning Slick","kind":"free row","text":"Once per turn, a creature is struck by the tar creeper's Molten Fist or starts its turn within 5 feet of the tar creeper, the creature catches fire and takes 7 (2d6) Fire damage at the start of each of its turns until it or another creature within 5 feet of it spends an action smothering the flames.","issue":"The ongoing fire has a rules-legal escape (action to smother) but the smothering fails to specify that the smothering creature must be able to reach/touch the burning creature, leaving adjacency alone as the only condition."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/87","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The feature name 'Siltborn Passage' promises the mire closing over/engulfing victims, but the text only halves Speed and never restrains, grapples, or engulfs anything."}];
const KEY='hand-score-dropped-findings-2026-11-11';
let scores={}; try{scores=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
let notes={}; try{notes=JSON.parse(localStorage.getItem(KEY+':notes')||'{}')}catch{}
let i=Math.max(0,ITEMS.findIndex(x=>!scores[x.id])); if(i<0)i=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(scores));localStorage.setItem(KEY+':notes',JSON.stringify(notes))}catch{}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function render(){
  const it=ITEMS[i]; if(!it){document.getElementById('card').innerHTML='<p class="done">All scored. Copy markdown above.</p>';tally();return;}
  const s=scores[it.id];
  document.getElementById('card').innerHTML=`<div class="card">
    <div class="meta"><span>${esc(it.sheet)} (CR ${esc(it.cr)})</span><span>${esc(it.sec)}</span><span class="kind ${it.kind==='free row'?'free':''}">${esc(it.kind)}${it.kind==='free row'?' — repairable today':''}</span><span style="margin-left:auto">${esc(it.run)}</span></div>
    <h2>${esc(it.row)}</h2><div class="row">${esc(it.text)}</div>
    <p class="issue">${esc(it.issue)}</p>
    <textarea class="note" id="note" placeholder="your note — why, or what the fix should have been (optional; C to focus)">${esc(notes[it.id]||'')}</textarea>
    <div class="btns"><button class="act ${s==='ACT'?'on':''}" data-s="ACT">ACT — a GM hits this</button><button class="ign ${s==='IGNORE'?'on':''}" data-s="IGNORE">IGNORE — a nit</button><button class="wrong ${s==='WRONG'?'on':''}" data-s="WRONG">WRONG — audit mistaken</button>
    <span class="nav"><button data-nav="-1">←</button><button data-nav="1">→</button></span></div></div>`;
  document.getElementById('pos').textContent=`${i+1} / ${ITEMS.length}`; tally();
  const nb=document.getElementById('note'); if(nb){nb.addEventListener('input',()=>{const it2=ITEMS[i]; if(!it2)return; if(nb.value.trim())notes[it2.id]=nb.value.trim(); else delete notes[it2.id]; save();});
    nb.addEventListener('keydown',e=>{if(e.key==='Escape'){nb.blur();e.preventDefault();}});}
}
function tally(){const c={ACT:0,IGNORE:0,WRONG:0};for(const v of Object.values(scores))c[v]=(c[v]||0)+1;
  document.getElementById('tally').innerHTML=`<span class="a">ACT ${c.ACT}</span><span>IGNORE ${c.IGNORE}</span><span class="w">WRONG ${c.WRONG}</span><span>· ${Object.keys(scores).length} scored</span>`;}
function score(s){const it=ITEMS[i];if(!it)return;scores[it.id]=s;save();i=Math.min(i+1,ITEMS.length);render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s)score(b.dataset.s); else if(b.dataset.nav){i=Math.max(0,Math.min(ITEMS.length-1,i+Number(b.dataset.nav)));render();}
  else if(b.id==='copy')copyMd(); else if(b.id==='reset'&&confirm('Clear every score and note?')){scores={};notes={};save();i=0;render();}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const k=e.key.toLowerCase();
  if(k==='c'){const nb=document.getElementById('note');if(nb){nb.focus();e.preventDefault();}return;}
  if(k==='a')score('ACT');else if(k==='i')score('IGNORE');else if(k==='w')score('WRONG');
  else if(e.key==='ArrowRight')i=Math.min(ITEMS.length-1,i+1),render();else if(e.key==='ArrowLeft')i=Math.max(0,i-1),render();
  else if(k==='u'){const prev=ITEMS.slice(0,i).reverse().find(x=>scores[x.id]);if(prev){delete scores[prev.id];save();i=ITEMS.indexOf(prev);render();}}});
function copyMd(){
  const scored=ITEMS.filter(x=>scores[x.id]); const c={ACT:0,IGNORE:0,WRONG:0}; const byKind={};
  for(const x of scored){c[scores[x.id]]++; if(scores[x.id]==='ACT')byKind[x.kind]=(byKind[x.kind]||0)+1;}
  const pct=n=>scored.length?Math.round(n/scored.length*100)+'%':'—';
  const lines=['# Hand-score — findings the confidence gate dropped','',`Scored ${scored.length} of ${ITEMS.length}.`,'',
    `- **ACT** ${c.ACT} (${pct(c.ACT)}) — the fix should have run`,`- **IGNORE** ${c.IGNORE} (${pct(c.IGNORE)})`,`- **WRONG** ${c.WRONG} (${pct(c.WRONG)})`,'',
    'ACT by row kind: '+Object.entries(byKind).map(([k,v])=>`${k} ${v}`).join(' · ')+' (only a free row is repairable today)','',
    '| score | sheet (CR) | row [kind] | the audit says | your note |','|---|---|---|---|---|',
    ...scored.map(x=>`| ${scores[x.id]} | ${x.sheet} (${x.cr}) | **${x.row}** [${x.kind}] | ${x.issue.replace(/\|/g,'/').slice(0,200)} | ${(notes[x.id]||'').replace(/\|/g,'/').replace(/\n+/g,' ')} |`),
    ...(scored.some(x=>notes[x.id])?['','## Notes','',...scored.filter(x=>notes[x.id]).map(x=>`- **${x.row}** (${x.sheet}, ${scores[x.id]}): ${notes[x.id].replace(/\n+/g,' ')}`)]:[])];
  const md=lines.join('\n'); const ta=document.getElementById('md'); ta.value=md; ta.style.display='block';
  navigator.clipboard?.writeText(md).then(()=>{document.getElementById('copy').textContent='Copied ✓';setTimeout(()=>document.getElementById('copy').textContent='Copy markdown',1500)}).catch(()=>{ta.select()});
}
render();
</script></body></html>
