 15 ft. 34 (6d8 + 7) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 16). While Grappled, the target has the Restrained condition.","issue":"The Restrained condition has no stated end condition tied to the grapple ending, leaving a GM unsure whether it persists after escape."},{"id":"probe-repair2-2026-11-10T14-46-14/09-daubjaw.md/Swallow/124","run":"probe-repair2-2026-11-10T14-46-14","sheet":"Daubjaw","cr":"5","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The daubjaw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the daubjaw, and takes 7 (2d6) Acid damage at the start of each of the daubjaw's turns. The daubjaw can have only one creature swallowed at a time. If the daubjaw takes 15 damage or more in a single turn from the swallowed creature, the daubjaw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 5 feet of the daubjaw. If the daubjaw dies, a swallowed creature exits the body Prone by using 5 feet of movement.","issue":"Swallowing removes the target from play with Blinded/Restrained and no initial save; the only exits are the 15-damage regurgitation or death, and the target cannot deal that damage while Blinded/Restrained with Total Cover from outside help — counterplay depends on the swallower letting it attack, and the entry does not specify the swallowed creature's reach/attacks."},{"id":"gate-c1-2026-11-10T07-37-32/01-goblin-boss.md/Multiattack/41","run":"gate-c1-2026-11-10T07-37-32","sheet":"Goblin Boss","cr":"1","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The boss makes two attacks, using Scimitar or Shortbow in any combination.","issue":"The Multiattack text refers to the creature as \"the boss\" rather than a consistent referent used elsewhere in the block (e.g. \"the goblin\"), a minor referent inconsistency."},{"id":"gate-b-engulf-2026-11-10T20-10-11/07-sunken-hold-eel.md/Drowning Coil/6","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Sunken Hold Eel","cr":"3","sec":"Bonus Actions","row":"Drowning Coil","kind":"free row","text":"*Constitution Saving Throw*: DC 13, one creature within 5 feet. *Failure:* 13 (3d8) Bludgeoning damage.","issue":"The saving throw has no trigger or timing stated, and dealing Bludgeoning damage with the name 'Drowning' implies suffocation/flavor it never delivers, but the real defect is the missing trigger — a GM cannot tell when this bonus action is invoked relative to the grapple."},{"id":"gate-b-engulf-2026-11-10T19-44-57/09-drowned-kelpie.md/Adhesive/3","run":"gate-b-engulf-2026-11-10T19-44-57","sheet":"Drowned Kelpie","cr":"4","sec":"Traits","row":"Adhesive","kind":"free row","text":"When the drowned kelpie hits a Huge or smaller creature with Hooves, the target is Grappled by the drowned kelpie (escape DC 14), ability checks to escape have Disadvantage, and a grappled creature can use its action to tear itself free and end the grapple.","issue":"The trait mandates Disadvantage on the escape check but never names which check (Strength (Athletics) or Dexterity (Acrobatics)), leaving the GM to guess what the creature rolls at Disadvantage."},{"id":"sweep-2026-11-10T15-02-59/24-sump-scythe-horror.md/Corrosive Runoff/135","run":"sweep-2026-11-10T15-02-59","sheet":"Sump Scythe Horror","cr":"9","sec":"Traits","row":"Corrosive Runoff","kind":"free row","text":"At the start of each of the scythe horror's turns, each creature Grappled by the scythe horror or grappling it, and the scythe horror itself, takes 16 (3d10) Acid damage.","issue":"The trait's own name and the self-damage clause are mechanically contradictory: the horror deals itself Acid damage every turn with no immunity or resistance stated, so a GM running the block deals damage to the horror that the fiction ('corrosive runoff') does not justify."},{"id":"sweep-2026-11-10T15-02-59/17-pit-fiend.md/Bite/133","run":"sweep-2026-11-10T15-02-59","sheet":"Pit Fiend","cr":"20","sec":"Actions","row":"Bite","kind":"print","text":"*Melee Attack Roll:* +14, reach 10 ft. 18 (3d6 + 8) Piercing damage. If the target is a creature, it must make the following saving throw. *Constitution Saving Throw*: DC 21. *Failure:*  The target has the Poisoned condition. While Poisoned, the target can't regain Hit Points and takes 21 (6d6) Poison damage at the start of each of its turns, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.","issue":"The Poisoned rider imposes a per-turn damage-and-no-healing lock with no counterplay clause of its own expressed for the ongoing clause beyond the repeat save, and the condition is applied to targets without a stated immunity check — a creature immune to Poisoned (per its own statblock) would still be subjected unless the GM ad hoc adjudicates; the ongoing effect needs an explicit immunity/end clause."},{"id":"gate-h-hold-2026-11-11T20-20-08/03-mire-gulper.md/Bite/79","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Gulper","cr":"1","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +4, reach 5 ft. 6 (1d8 + 2) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 12). While Grappled, the target has the Restrained condition. If the gulper moved at least 20 feet straight toward the target immediately before the hit and the target is Large or smaller, the target has the Prone condition, and the gulper can make one Bite attack against it as a Bonus Action.","issue":"The conditional rider falls inside the Bite attack roll resolution but there is no 'before the attack' statement and the prone rider triggers on 'the hit' (of which attack?); the condition is also left with no end reference beyond its own standing-up, which is fine, but the 'immediately before the hit' phrasing is not a defined timing within the action."},{"id":"gate-h-hold-2026-11-11T17-08-23/01-gelatinous-cube.md/Transparent/71","run":"gate-h-hold-2026-11-11T17-08-23","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Transparent","kind":"print","text":"Even when the gelatinous cube is in plain sight, a creature must succeed on a DC 15 Wisdom (Perception) check to notice the gelatinous cube if the creature hasn't witnessed the gelatinous cube move or otherwise act.","issue":"No timing or action cost is given for when the check is made, so the GM cannot determine whether noticing is passive, an action, or free."},{"id":"gate-h-hold-2026-11-11T15-25-20/08-sedgewick.md/Spellcasting/65","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Sedgewick","cr":"6","sec":"Actions","row":"Spellcasting","kind":"print","text":"Sedgewick casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 14):\n\n- **At Will:** *Detect Magic*, *Light*, *Mage Armor*, *Mage Hand*, *Prestidigitation*\n- **2/Day Each:** *Fireball*, *Invisibility*\n- **1/Day Each:** *Cone of Cold*, *Fly*","issue":"The Spellcasting entry's name and text promise spellcasting, but the block provides no spellcasting action timing (action? bonus action?) and the spells listed include ones with verbal/somatic components unaddressed; more importantly, the entry never states that casting a spell costs an action, making the resolution timing ambiguous alongside Multiattack."},{"id":"gate-h-hold-2026-11-11T05-44-38/10-cave-roper.md/Reel/60","run":"gate-h-hold-2026-11-11T05-44-38","sheet":"Cave Roper","cr":"5","sec":"Actions","row":"Reel","kind":"template","text":"*Strength Saving Throw*: DC 14, one Medium or smaller creature within 30 feet. *Failure:* 9 (2d8) Piercing damage, and the target is pulled up to 15 feet straight toward the cave roper. *Success:* Half damage only.","issue":"Reel states a save and range but no target-visibility or line-of-sight requirement and no action timing (is it an action, part of Multiattack only?); its only entry point is the Multiattack replacement, so its action cost is ambiguous when used alone."},{"id":"gate-h-hold-2026-11-11T05-18-32/01-cave-roper.md/Multiattack/49","run":"gate-h-hold-2026-11-11T05-18-32","sheet":"Cave Roper","cr":"5","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The cave roper makes two Tentacle attacks, uses Reel, and makes two Bite attacks. It can replace one attack with a use of Reel In.","issue":"The sentence begins mid-phrase in a way that reads as a broken/half-deleted opening."},{"id":"gate-c1-2026-11-10T07-24-12/05-grentok.md/Loathsome Limbs/35","run":"gate-c1-2026-11-10T07-24-12","sheet":"Grentok","cr":"6","sec":"Traits","row":"Loathsome Limbs (4/Day)","kind":"print","text":"If Grentok ends any turn Bloodied and took 15+ Slashing damage during that turn, one of Grentok's limbs is severed, falls into Grentok's space, and becomes a Troll Limb. The limb acts immediately after Grentok's turn. Grentok has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points.","issue":"The trigger nests a persistent state check ('ends any turn Bloodied') with a per-turn damage tally ('15+ Slashing damage during that turn') that the GM must track across every creature's turn, with no bookkeeping aid given in the block."},{"id":"gate-b-engulf-2026-11-10T20-10-11/06-rivergrip-lurker.md/Still Beneath the Silt/4","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Rivergrip Lurker","cr":"2","sec":"Traits","row":"Still Beneath the Silt","kind":"free row","text":"While the lurker remains motionless in water and has not yet attacked, or while it has a creature Grappled with its Jaws in water, a creature that has not yet seen the lurker move must succeed on a Wisdom (Perception) check against DC 13 to notice it before it strikes, and a creature Grappled by the lurker's Jaws in water is pulled under and must hold its breath or begin suffocating until it is no longer Grappled.","issue":"The trait silently assumes a 'silt' substrate that its own rules never require (any water triggers it), creating a name/content mismatch with the trait's premise."},{"id":"gate-h-hold-2026-11-11T20-20-08/09-sand-maw.md/Rolling Breach/89","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Sand-Maw","cr":"9","sec":"Actions","row":"Rolling Breach (Recharge 5-6)","kind":"free row","text":"*Dexterity Saving Throw*: DC 15, each creature in a 30-foot Line. *Failure:* 45 (13d6) Bludgeoning damage, and the target has the Prone condition.","issue":"Missing preposition/verb structure leaves the target clause ungrammatical."},{"id":"sweep-2026-11-10T15-02-59/13-purple-worm.md/Bite/132","run":"sweep-2026-11-10T15-02-59","sheet":"Purple Worm","cr":"15","sec":"Actions","row":"Bite","kind":"print","text":"*Melee Attack Roll:* +14, reach 10 ft. 22 (3d8 + 9) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 22), and it has the Restrained condition until the grapple ends.","issue":"The swallow line permits up to three creatures swallowed at a time, but the Swallow bonus action allows only one target and the Grappled condition from Bite already carries its own escape; the Restrained condition applied here has no separate exit beyond the grapple escape, which is fine, but the clause reads as applying Restrained perpetually even though Grappled already suppresses movement."},{"id":"gate-h-hold-2026-11-11T22-40-27/07-fenmuck-grask.md/Regeneration/95","run":"gate-h-hold-2026-11-11T22-40-27","sheet":"Fenmuck Grask","cr":"5","sec":"Traits","row":"Regeneration","kind":"print","text":"The fenmuck grask regains 15 Hit Points at the start of each of its turns. If the fenmuck grask takes Acid or Fire damage, this trait doesn't function on the fenmuck grask's next turn. The fenmuck grask dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"Sentence begins mid-flow after the prior sentence and there is no period-then-capital separation from the preceding clause."},{"id":"sweep-2026-11-10T15-02-59/12-plague-archon-of-flies.md/Multiattack/131","run":"sweep-2026-11-10T15-02-59","sheet":"Plague Archon of Flies","cr":"13","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The plague archon makes three attacks, using Chitin Forelimb or Flyblown Maw in any combination. It can replace one attack with a use of Flyblown Shriek.","issue":"Multiattack allows replacing an attack with Flyblown Shriek, but Flyblown Shriek is a cone save effect with no per-target gating clause in the main action, forcing the GM to adjudicate whether the cone is centered on the archon or requires a target during a replacement."},{"id":"gate-h-hold-2026-11-11T15-25-20/11-canopy-reeler.md/Multiattack/69","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Canopy Reeler","cr":"2","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The reeler makes two Fangs attacks. It can replace one attack with a use of Silk Snare.","issue":"Referent inconsistency: the monster refers to itself as 'The reeler' in a block whose name is 'Canopy Reeler' and whose other entries call it 'the reeler' only via the name, making the Multiattack's subject inconsistent with the block's own naming."},{"id":"gate-h-hold-2026-11-11T05-22-56/09-sunken-road-maw.md/Maw of the Hollow Road/53","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Sunken Road Maw","cr":"9","sec":"Actions","row":"Maw of the Hollow Road","kind":"free row","text":"*Strength Saving Throw*: DC 15, each creature in a 30-foot Cone. *Failure:* The target is pulled up to 20 feet straight toward the maw, and the target has the Prone condition.","issue":"The name 'Maw of the Hollow Road' promises a bite/deglutition mechanic, but the entry only pulls and knocks Prone — the maw's mouth never features in the effect."},{"id":"gate-h-hold-2026-11-11T05-22-56/12-abyssal-coil-spawn.md/Coiling Drag/54","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Abyssal Coil-Spawn","cr":"6","sec":"Actions","row":"Coiling Drag","kind":"template","text":"*Strength Saving Throw:* DC 14, each creature in a 30-foot Cone. *Failure:* The target is pulled up to 15 feet straight toward the coil-spawn, and its Speed is 0 until the start of the coil-spawn's next turn.","issue":"The pull-toward plus Speed-0 clause is written as if it denies movement, but nothing in the entry prevents the target from simply moving away on its own turn once the Speed-0 expires, and 'straight toward the coil-spawn' gives no landing/adjacency handling if the target is already adjacent or blocked — but more critically, a Cone save-based pull that places targets adjacent to the creature is an area reposition with no clause addressing what happens if the pull would move a creature"},{"id":"gate-c1-2026-11-10T07-24-12/07-ashvault-wyrm.md/Ember-Soot Pall/36","run":"gate-c1-2026-11-10T07-24-12","sheet":"Ashvault Wyrm","cr":"17","sec":"Traits","row":"Ember-Soot Pall","kind":"template","text":"*Constitution Saving Throw*: DC 19, any creature that starts its turn in a 20-foot Emanation originating from the wyrm. *Failure:* The target has the Poisoned condition until the end of its next turn. *Success:* The target is immune to this creature's aura for 24 hours.","issue":"The Poisoned condition is imposed with a fixed end but no repeat save or escape; while the fixed duration does provide an exit, the aura re-applies every turn the creature starts within it, effectively locking a creature that cannot leave the emanation into perpetual Poisoned with no rules-legal response."},{"id":"gate-h-hold-2026-11-11T15-25-20/06-drowned-maw.md/Bite/63","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Drowned Maw","cr":"3","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 12 (2d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"The Restrained condition rides on Grappled with no independent exit and no statement of who is grappling whom or what maintains it, but it does at least inherit the escape DC; the real defect is that nothing states the escape also ends Restrained clearly — adjudicable but ambiguous."},{"id":"gate-type-2026-11-10T18-56-12/08-unicorn.md/Shimmering Shield/118","run":"gate-type-2026-11-10T18-56-12","sheet":"Unicorn","cr":"5","sec":"Legendary Actions","row":"Shimmering Shield","kind":"print","text":"The unicorn targets itself or one creature it can see within 60 feet of itself. The target gains 10 (3d6) Temporary Hit Points, and its AC increases by 2 until the end of the unicorn's next turn. The unicorn can't take this action again until the start of its next turn.","issue":"The entry stacks a built-in 'can't take this action again' limiter on top of the 3/day Legendary Action economy, a redundant/contradictory limiter that complicates resolution."},{"id":"gate-savefit-2026-11-10T15-28-09/02-ashen-templar.md/Shield Bash/105","run":"gate-savefit-2026-11-10T15-28-09","sheet":"Ashen Templar","cr":"6","sec":"Actions","row":"Shield Bash","kind":"print","text":"*Strength Saving Throw*: DC 15, one creature within 5 feet that the templar can see. *Failure:*  9 (2d4 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.","issue":"Prone carries its own exit (standing up costs movement), so this is not actually a counterplay defect — however the shield bash imposes Prone via a Strength save with no duration rider, which is compliant. No defect; omit."},{"id":"gate-h-hold-2026-11-11T20-20-08/02-pit-born-ooze.md/Slam/77","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Pit-Born Ooze","cr":"3","sec":"Actions","row":"Slam","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 7 (1d8 + 3) Bludgeoning damage plus 5 (1d10) Acid damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"The entry applies the Grappled condition to Large creatures, but the Swallow bonus action only handles Medium or smaller targets, leaving no adjudicated pathway for what the ooze does with a Large grappled target beyond Restrained."},{"id":"gate-c2-2026-11-10T07-49-08/05-hobgoblin-captain.md/Multiattack/43","run":"gate-c2-2026-11-10T07-49-08","sheet":"Hobgoblin Captain","cr":"3","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The captain makes two attacks, using Greatsword or Longbow in any combination.","issue":"Lowercase start to the sentence is a capitalization issue, which is out of scope."},{"id":"gate-retaliate-2026-11-11T19-19-28/04-cinder-brute.md/Molten Recoil/102","run":"gate-retaliate-2026-11-11T19-19-28","sheet":"Cinder Brute","cr":"6","sec":"Reactions","row":"Molten Recoil","kind":"free row","text":"*Trigger:* A creature within reach hits the cinder brute with a melee attack. *Response:* The brute's crust splits and sprays a gout of clinging magma at the attacker, which must make a Dexterity saving throw (DC 14); on a failure it is Restrained by cooling slag, and it can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.","issue":"Save DC is given but the trigger's timing is only implicit; more critically, the reaction names no energy type for the magma despite it being 'molten' — the effect deals no damage and applies no fire, so the medium is undefined beyond the Restrained rider."},{"id":"gate-c2-2026-11-10T07-49-08/05-hobgoblin-captain.md/Greatsword/42","run":"gate-c2-2026-11-10T07-49-08","sheet":"Hobgoblin Captain","cr":"3","sec":"Actions","row":"Greatsword","kind":"print","text":"*Melee Attack Roll:* +4, reach 5 ft. 9 (2d6 + 2) Slashing damage plus 3 (1d6) Poison damage.","issue":"A hobgoblin captain with no Poison-adjacent trait or feature dealing Poison damage on its weapon is a type/theme inconsistency—nothing in the block establishes poison; this reads as a reskinned damage type."},{"id":"gate-b-engulf-2026-11-10T23-37-26/08-muck-lurker.md/Loathsome Limbs/25","run":"gate-b-engulf-2026-11-10T23-37-26","sheet":"Muck Lurker","cr":"5","sec":"Traits","row":"Loathsome Limbs (4/Day)","kind":"print","text":"If the lurker ends any turn Bloodied and took 15+ Slashing damage during that turn, one of the lurker's limbs is severed, falls into the lurker's space, and becomes a Troll Limb. The limb acts immediately after the lurker's turn. The lurker has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points.","issue":"(4/Day) The trait requires the GM to track per-turn Slashing damage totals, Bloodied state at end of turn, limb count against an Exhaustion level and a 4/Day cap, and a spawned creature acting on its own initiative—too much hidden state for a ~10-second resolution."},{"id":"gate-retaliate-2026-11-11T19-15-50/02-reedmaw-swallower.md/Reed-Slick Hide/99","run":"gate-retaliate-2026-11-11T19-15-50","sheet":"Reedmaw Swallower","cr":"3","sec":"Traits","row":"Reed-Slick Hide","kind":"template","text":"Difficult Terrain composed of marsh, mud, and reeds doesn't cost the swallower extra movement, and the swallower can move across marsh, mud, and reeds without needing to make an ability check.","issue":"The trait references ability checks for movement that no rule in the block or the base movement rules require, so the GM has no check to waive and the clause cannot be adjudicated as written."},{"id":"gate-c1-2026-11-10T05-19-21/03-ledger-hulk.md/Slag Grind/30","run":"gate-c1-2026-11-10T05-19-21","sheet":"Ledger Hulk","cr":"10","sec":"Actions","row":"Slag Grind","kind":"free row","text":"*Strength Saving Throw*: DC 17, one creature within 10 feet. *Failure:* The target has the Grappled condition (escape DC 17).","issue":"The grapple has an escape DC but no size restriction, so as written the hulk can grapple any creature, including Huge and Gargantuan ones it could not plausibly grip."},{"id":"gate-b-engulf-2026-11-10T20-20-36/12-dunegullet.md/Swallow/13","run":"gate-b-engulf-2026-11-10T20-20-36","sheet":"Dunegullet","cr":"9","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The dunegullet swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the dunegullet, and takes 10 (3d6) Acid damage at the start of each of the dunegullet's turns. The dunegullet can have only one creature swallowed at a time. If the dunegullet takes 25 damage or more on a single turn from the swallowed creature, the dunegullet must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the dunegullet. If the dunegullet dies, a swallowed creature exits the body Prone by using 10 feet of movement.","issue":"This entry stacks three distinct end-conditions (damage-threshold regurgitation, death-ejection with a 10-foot movement cost, and the implied ongoing Acid damage timing) plus the swallowed Blinded/Restrained/Total Cover state, and the GM must track per-turn damage from a creature it cannot see or target—state the block gives no tracker for, straining mid-combat usability."},{"id":"gate-c1-2026-11-10T07-24-12/11-thrillmaw.md/Swallow/39","run":"gate-c1-2026-11-10T07-24-12","sheet":"Thrillmaw","cr":"7","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The thrillmaw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the thrillmaw, and takes 7 (2d6) Psychic damage at the start of each of the thrillmaw's turns. The thrillmaw can have only one creature swallowed at a time. If the thrillmaw takes 15 damage or more in a single turn from the swallowed creature, the thrillmaw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 5 feet of the thrillmaw. If the thrillmaw dies, a swallowed creature exits the body Prone by using 5 feet of movement.","issue":"Swallowed creatures have no action-based escape (only the damage threshold), but the 15-damage regurgitate clause is an interior-escape path, so counterplay exists; however the clause references damage 'from the swallowed creature' with no statement of whether that includes spell damage or only attacks."},{"id":"probe-repair2-2026-11-10T14-46-14/08-mother-ash.md/Smother/122","run":"probe-repair2-2026-11-10T14-46-14","sheet":"Mother Ash","cr":"9","sec":"Bonus Actions","row":"Smother","kind":"chassis","text":"Mother Ash smothers one Medium or smaller creature it is grappling. While smothered, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside Mother Ash, and takes 10 (3d6) Necrotic damage at the start of each of Mother Ash's turns. Mother Ash can have only one creature smothered at a time. If Mother Ash takes 25 damage or more on a single turn from the smothered creature, Mother Ash must release the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of Mother Ash. If Mother Ash dies, a smothered creature pulls free Prone by using 10 feet of movement.","issue":"Smother imposes Restrained and Blinded with no repeat save or escape DC; the swallowed-style exit only fires on the release trigger, so there is no per-turn path out."},{"id":"gate-h-hold-2026-11-11T20-20-08/09-sand-maw.md/Tunneler/88","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Sand-Maw","cr":"9","sec":"Traits","row":"Tunneler","kind":"template","text":"The sand-maw can burrow through solid rock at half its Burrow Speed and leaves a 10-foot-diameter tunnel in its wake.","issue":"Nothing grants the sand-maw a Burrow Speed through solid rock, and the 10-foot-diameter tunnel is larger than its 5-foot-wide body, making the width adjudicable but the half-speed undefined without a base burrow-through-rock rule."}];
const KEY='hand-score-dropped-findings-2026-11-11';
let scores={}; try{scores=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
let notes={}; try{notes=JSON.parse(localStorage.getItem(KEY+':notes')||'{}')}catch{}
let i=Math.max(0,ITEMS.findIndex(x=>!scores[x.id])); if(i<0)i=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(scores));localStorage.setItem(KEY+':notes',JSON.stringify(notes))}catch{}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function render(){
  const it=ITEMS[i]; if(!it){document.getElementById('card').innerHTML='<p class="done">All scored. Copy markdown above.</p>';tally();return;}
  const s=scores[it.id];
  document.getElementById('card').innerHTML=`<div class="card">
    <div class="meta"><span>${esc(it.sheet)} (CR ${esc(it.cr)})</span><span>${esc(it.sec)}</span><span class="kind ${it.kind==='free row'?'free':''}">${esc(it.kind)}${it.kind==='free row'?' — repairable today':''}</span><span style="margin-left:auto">${esc(it.run)}</span></div>
    <h2>${esc(it.row)}</h2><div class="row">${esc(it.text)}</div>
    <p class="issue">${esc(it.issue)}</p>
    <textarea class="note" id="note" placeholder="your note — why, or what the fix should have been (optional; C to focus)">${esc(notes[it.id]||'')}</textarea>
    <div class="btns"><button class="act ${s==='ACT'?'on':''}" data-s="ACT">ACT — a GM hits this</button><button class="ign ${s==='IGNORE'?'on':''}" data-s="IGNORE">IGNORE — a nit</button><button class="wrong ${s==='WRONG'?'on':''}" data-s="WRONG">WRONG — audit mistaken</button>
    <span class="nav"><button data-nav="-1">←</button><button data-nav="1">→</button></span></div></div>`;
  document.getElementById('pos').textContent=`${i+1} / ${ITEMS.length}`; tally();
  const nb=document.getElementById('note'); if(nb){nb.addEventListener('input',()=>{const it2=ITEMS[i]; if(!it2)return; if(nb.value.trim())notes[it2.id]=nb.value.trim(); else delete notes[it2.id]; save();});
    nb.addEventListener('keydown',e=>{if(e.key==='Escape'){nb.blur();e.preventDefault();}});}
}
function tally(){const c={ACT:0,IGNORE:0,WRONG:0};for(const v of Object.values(scores))c[v]=(c[v]||0)+1;
  document.getElementById('tally').innerHTML=`<span class="a">ACT ${c.ACT}</span><span>IGNORE ${c.IGNORE}</span><span class="w">WRONG ${c.WRONG}</span><span>· ${Object.keys(scores).length} scored</span>`;}
function score(s){const it=ITEMS[i];if(!it)return;scores[it.id]=s;save();i=Math.min(i+1,ITEMS.length);render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s)score(b.dataset.s); else if(b.dataset.nav){i=Math.max(0,Math.min(ITEMS.length-1,i+Number(b.dataset.nav)));render();}
  else if(b.id==='copy')copyMd(); else if(b.id==='reset'&&confirm('Clear every score and note?')){scores={};notes={};save();i=0;render();}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const k=e.key.toLowerCase();
  if(k==='c'){const nb=document.getElementById('note');if(nb){nb.focus();e.preventDefault();}return;}
  if(k==='a')score('ACT');else if(k==='i')score('IGNORE');else if(k==='w')score('WRONG');
  else if(e.key==='ArrowRight')i=Math.min(ITEMS.length-1,i+1),render();else if(e.key==='ArrowLeft')i=Math.max(0,i-1),render();
  else if(k==='u'){const prev=ITEMS.slice(0,i).reverse().find(x=>scores[x.id]);if(prev){delete scores[prev.id];save();i=ITEMS.indexOf(prev);render();}}});
function copyMd(){
  const scored=ITEMS.filter(x=>scores[x.id]); const c={ACT:0,IGNORE:0,WRONG:0}; const byKind={};
  for(const x of scored){c[scores[x.id]]++; if(scores[x.id]==='ACT')byKind[x.kind]=(byKind[x.kind]||0)+1;}
  const pct=n=>scored.length?Math.round(n/scored.length*100)+'%':'—';
  const lines=['# Hand-score — findings the confidence gate dropped','',`Scored ${scored.length} of ${ITEMS.length}.`,'',
    `- **ACT** ${c.ACT} (${pct(c.ACT)}) — the fix should have run`,`- **IGNORE** ${c.IGNORE} (${pct(c.IGNORE)})`,`- **WRONG** ${c.WRONG} (${pct(c.WRONG)})`,'',
    'ACT by row kind: '+Object.entries(byKind).map(([k,v])=>`${k} ${v}`).join(' · ')+' (only a free row is repairable today)','',
    '| score | sheet (CR) | row [kind] | the audit says | your note |','|---|---|---|---|---|',
    ...scored.map(x=>`| ${scores[x.id]} | ${x.sheet} (${x.cr}) | **${x.row}** [${x.kind}] | ${x.issue.replace(/\|/g,'/').slice(0,200)} | ${(notes[x.id]||'').replace(/\|/g,'/').replace(/\n+/g,' ')} |`),
    ...(scored.some(x=>notes[x.id])?['','## Notes','',...scored.filter(x=>notes[x.id]).map(x=>`- **${x.row}** (${x.sheet}, ${scores[x.id]}): ${notes[x.id].replace(/\n+/g,' ')}`)]:[])];
  const md=lines.join('\n'); const ta=document.getElementById('md'); ta.value=md; ta.style.display='block';
  navigator.clipboard?.writeText(md).then(()=>{document.getElementById('copy').textContent='Copied ✓';setTimeout(()=>document.getElementById('copy').textContent='Copy markdown',1500)}).catch(()=>{ta.select()});
}
render();
</script></body></html>
