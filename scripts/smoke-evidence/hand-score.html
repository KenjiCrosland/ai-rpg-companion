<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand-score — dropped audit findings</title>
<style>
  :root{--ink:#2b2420;--paper:#f6f1e7;--card:#fffdf8;--line:#d9cfbf;--act:#8a2f1f;--ign:#6b6150;--wrong:#1f4f8a;--muted:#7a6f62}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Georgia,"Iowan Old Style",serif}
  header{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  header b{font-size:17px} .tally span{display:inline-block;margin-right:12px} .tally .a{color:var(--act)} .tally .w{color:var(--wrong)}
  main{max-width:860px;margin:18px auto;padding:0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap} .kind{border:1px solid var(--line);border-radius:10px;padding:0 8px}
  .kind.free{border-color:var(--act);color:var(--act)}
  h2{margin:8px 0 10px;font-size:20px} .row{background:#f1eadc;border-left:3px solid var(--line);padding:10px 12px;margin:8px 0;font-size:14.5px}
  .issue{margin:12px 0 4px} .issue:before{content:"the audit says: ";color:var(--muted);font-style:italic}
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap} button{font:inherit;padding:9px 16px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.act{border-color:var(--act);color:var(--act)} button.ign{color:var(--ign)} button.wrong{border-color:var(--wrong);color:var(--wrong)} button.on{color:#fff}
  button.act.on{background:var(--act)} button.ign.on{background:var(--ign)} button.wrong.on{background:var(--wrong)}
  .nav{margin-left:auto;display:flex;gap:8px} kbd{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:#fff;color:var(--muted)}
  textarea#md{width:100%;height:220px;margin-top:14px;font:12.5px ui-monospace,Menlo,monospace;display:none}
  textarea.note{width:100%;box-sizing:border-box;min-height:58px;margin-top:12px;padding:8px 10px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:5px;background:#fff;resize:vertical}
  .note::placeholder{color:#b3a996;font-style:italic}
  .done{text-align:center;color:var(--muted);margin:30px 0}
</style></head><body>

  <span style="margin-left:auto"><button id="copy">Copy markdown</button> <button id="reset" title="clear every score">Reset</button></span></header>

<p class="done"><kbd>A</kbd> act &nbsp; <kbd>I</kbd> ignore &nbsp; <kbd>W</kbd> wrong &nbsp; <kbd>C</kbd> comment (<kbd>Esc</kbd> leaves it) &nbsp; <kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>U</kbd> undo — scores and notes stay in this browser until Reset.</p></main>
<script>
const ITEMS=[{"id":"gate-c2-2026-11-10T07-49-08/10-lord-vexmoor.md/Protective Magic/45","run":"gate-c2-2026-11-10T07-49-08","sheet":"Lord Vexmoor","cr":"12","sec":"Reactions","row":"Protective Magic (3/Day)","kind":"chassis","text":"*Trigger:* Vexmoor is hit by an attack roll. *Response:* Vexmoor casts *Shield* in response, gaining a +5 bonus to AC until the start of its next turn, including against the triggering attack.","issue":"Spellcasting lists Shield as a castable spell but the reaction's +5 AC matches Shield's exact effect while naming a different spell; a GM cannot tell whether this is a rename of Shield (redundant with Spellcasting) or a distinct 3/Day reaction that grants Shield's benefit without the spell's other rules."},{"id":"gate-b-engulf-2026-11-11T02-19-26/09-bridled-drowner.md/Weed-Bone Bridle/29","run":"gate-b-engulf-2026-11-11T02-19-26","sheet":"Bridled Drowner","cr":"4","sec":"Actions","row":"Weed-Bone Bridle","kind":"template","text":"*Wisdom Saving Throw:* DC 13, one creature within 60 feet that can see or hear the weed-and-bone bridle. *Failure:* The target has the Charmed condition until the start of its next turn, and while Charmed this way, it must move toward the drowner by the safest available route on its turn.","issue":"The forced-movement compulsion has no save-based or action-based path out once the initial save fails; the only exit is the fixed one-round duration, which is a duration but the compulsion itself offers the target no repeat save or escape."},{"id":"gate-b-engulf-2026-11-10T20-20-36/02-tar-cistern-sludge.md/Gullet of Tar/10","run":"gate-b-engulf-2026-11-10T20-20-36","sheet":"Tar Cistern Sludge","cr":"3","sec":"Actions","row":"Gullet of Tar (Recharge 5-6)","kind":"free row","text":"*Dexterity Saving Throw*: DC 13, one creature within 15 feet. *Failure:* 24 (7d6) Acid damage, and the target is pulled up to 5 feet straight toward the sludge, and the target has the Restrained condition until the end of its next turn.","issue":"The forced movement direction ('straight toward') is undefined relative to the target's position and has no basis for a pull — it should be defined as toward the sludge without ambiguity."},{"id":"gate-b-engulf-2026-11-10T20-31-09/03-gorgebellied-marshfrog.md/Setting Slime/14","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Gorgebellied Marshfrog","cr":"1","sec":"Traits","row":"Setting Slime","kind":"free row","text":"When a creature ends its turn still Grappled or Restrained by the marshfrog, the creature's Speed is reduced by 10 feet until the end of its next turn as the drying slime stiffens on its limbs.","issue":"The speed reduction triggers on a creature still Grappled or Restrained at end of turn, but Restrained creatures already have Speed 0; applying it while grappled has no duration anchor if the grapple ends immediately after — the effect's end timing is keyed to 'its next turn' but the source condition may already be gone, leaving an untracked speed penalty."},{"id":"gate-b-engulf-2026-11-10T20-20-36/08-mire-holdsoul.md/Regeneration/11","run":"gate-b-engulf-2026-11-10T20-20-36","sheet":"Mire Holdsoul","cr":"5","sec":"Traits","row":"Regeneration","kind":"print","text":"The holdsoul regains 15 Hit Points at the start of each of its turns. If the holdsoul takes Acid or Fire damage, this trait doesn't function on the holdsoul's next turn. The holdsoul dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"Segmentation garble: the sentence containing 'this trait doesn't function...' runs into the next sentence without a sentence break, producing a broken, half-deleted run-on."},{"id":"sweep-2026-11-10T15-02-59/04-funeral-bell-wraith.md/Deathwatch Toll/126","run":"sweep-2026-11-10T15-02-59","sheet":"Funeral Bell Wraith","cr":"3","sec":"Actions","row":"Deathwatch Toll","kind":"free row","text":"*Wisdom Saving Throw*: DC 13, one creature within 60 feet. *Failure:* 13 (3d8) Psychic damage.","issue":"The name promises a death-watch effect (marking or harming the dying), but the entry is a plain psychic-damage save with no death or dying mechanic."},{"id":"gate-b-engulf-2026-11-10T20-31-09/06-scarreled-deathroll.md/Drowning Drag/15","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Scarreled Deathroll","cr":"2","sec":"Actions","row":"Drowning Drag","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 15 feet straight toward Deathroll.","issue":"The name promises drowning/pulling underwater, but the text only pulls a target 15 feet toward the creature with no water, drowning, or suffocation mechanic."},{"id":"gate-h-hold-2026-11-11T05-41-21/01-gelatinous-cube.md/Ooze Cube/55","run":"gate-h-hold-2026-11-11T05-41-21","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Ooze Cube","kind":"print","text":"Cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to Cube's Engulf and has Disadvantage on the saving throw.\nCreatures inside Cube have Total Cover, and Cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time.\nAs an action, a creature within 5 feet of Cube can pull a creature or an object out of Cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","issue":"Creatures engulfed inside a transparent filling cube gaining Total Cover from all directions is internally contradictory and provides no adjudicable geometry."},{"id":"gate-c2-2026-11-10T07-49-08/12-grask-ironjaw.md/Riposte/46","run":"gate-c2-2026-11-10T07-49-08","sheet":"Grask Ironjaw","cr":"5","sec":"Reactions","row":"Riposte","kind":"template","text":"*Trigger:* A creature within 5 feet of Grask misses it with a melee attack roll. *Response:* Grask makes one Longsword attack against that creature.","issue":"Riposte and Iron-Shod Parry both trigger on the same event (a melee miss) but Riposte references Grask as \"it\" while the rest of the block uses \"he\", creating referent inconsistency."},{"id":"gate-h-hold-2026-11-11T22-40-27/10-cave-roper.md/Stone Anchor/97","run":"gate-h-hold-2026-11-11T22-40-27","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Stone Anchor","kind":"free row","text":"While the cave roper is anchored to a ceiling or rocky shelf it clings to, the cave roper cannot be moved against its will, and a creature it has Grappled cannot be moved away from it by any means short of teleportation.","issue":"The trait promises to prevent moving a grappled creature by any means short of teleportation, but the block provides no rules for releasing or breaking the anchoring hold beyond the escape DC, making the trait's scope adjudication-dependent and potentially contradicting forced movement effects the block does not address."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/85","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The trait depends on a trackable spatial state ('the wet ground she passed through') that the block gives the GM no way to define, mark, or persist across turns."},{"id":"gate-c3-2026-11-10T08-14-41/11-unicorn.md/Shimmering Shield/48","run":"gate-c3-2026-11-10T08-14-41","sheet":"Unicorn","cr":"5","sec":"Legendary Actions","row":"Shimmering Shield","kind":"print","text":"The unicorn targets itself or one creature it can see within 60 feet of itself. The target gains 10 (3d6) Temporary Hit Points, and its AC increases by 2 until the end of the unicorn's next turn. The unicorn can't take this action again until the start of its next turn.","issue":"The limiter clause is lowercase and grammatically detached as written, making the cost/limiter awkward to adjudicate alongside the legendary action budget."},{"id":"gate-b-engulf-2026-11-10T20-31-09/06-scarreled-deathroll.md/Bite/16","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Scarreled Deathroll","cr":"2","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 7 (1d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"The Grappled condition is applied only on a hit, but the Restrained rider applies \"while Grappled\" without stating it is contingent on this Bite's grapple, leaving it ambiguous whether any grapple source triggers it."},{"id":"gate-retaliate-2026-11-11T19-19-28/03-vess-ardaine.md/Iron-Bound Blade/100","run":"gate-retaliate-2026-11-11T19-19-28","sheet":"Vess Ardaine","cr":"5","sec":"Traits","row":"Iron-Bound Blade","kind":"free row","text":"When Vess would be reduced to 0 Hit Points, the rapier shatters and Vess instead drops to 1 Hit Point; it reforms when she completes a Short Rest.","issue":"The trait's name and text promise a blade mechanic, but the effect triggers on Vess being reduced to 0 HP—the rapier is never referenced as the source of the trigger, and there is no stated consequence if the blade is somehow already broken or lost."},{"id":"gate-h-hold-2026-11-11T15-25-20/06-drowned-maw.md/Weed-Shadow Ambush/64","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Drowned Maw","cr":"3","sec":"Reactions","row":"Weed-Shadow Ambush","kind":"free row","text":"*Trigger:* A creature moves within 5 feet of Maw while Maw is submerged in water or weed-shadow and hidden, holding perfectly still with only its eyes and hooked jaw showing. *Response:* Maw makes one Bite attack against that creature, and on a hit the target is pulled up to 5 feet straight toward Maw.","issue":"The trait bundles stealth-narration, a movement trigger, and a bite into one run-on with no clear resolution order — hard to adjudicate mid-combat."},{"id":"gate-b-engulf-2026-11-10T19-44-57/01-gelatinous-cube.md/Ooze Cube/0","run":"gate-b-engulf-2026-11-10T19-44-57","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Ooze Cube","kind":"print","text":"Cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to Cube's Engulf and has Disadvantage on the saving throw.\nCreatures inside Cube have Total Cover, and Cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time.\nAs an action, a creature within 5 feet of Cube can pull a creature or an object out of Cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","issue":"The trait is named Ooze Cube but this clause describes a generic external rescue action rather than anything about the cube's ooze nature, and the name promises a mechanic (the ooze body) that the text splits across three separate rules with no unifying mechanic."},{"id":"gate-c3-2026-11-10T08-14-41/02-ser-oathe.md/Shield Bash/47","run":"gate-c3-2026-11-10T08-14-41","sheet":"Ser Oathe","cr":"5","sec":"Actions","row":"Shield Bash","kind":"print","text":"*Strength Saving Throw*: DC 15, one creature within 5 feet that Ser can see. *Failure:*  9 (2d4 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.","issue":"The save is structured as a pseudo-attack statblock line rather than a proper save effect with a target-and-time trigger phrasing and has a doubly spaced number."},{"id":"gate-c2-2026-11-10T07-49-08/08-vaskis-sshar.md/Fen Step/44","run":"gate-c2-2026-11-10T07-49-08","sheet":"Vaskis Sshar","cr":"7","sec":"Traits","row":"Fen Step","kind":"template","text":"Difficult Terrain composed of mud, muck, shallow water, and half-sunken roots doesn't cost Vaskis extra movement, and Vaskis can move across mud, muck, shallow water, and half-sunken roots without needing to make an ability check.","issue":"Capitalization-only variance in a list repeated across two traits is a formatting concern, not a mechanical defect; more importantly the redundancy is captured above."},{"id":"gate-c1-2026-11-10T07-24-12/03-granite-ancestor.md/Sunken Blow/33","run":"gate-c1-2026-11-10T07-24-12","sheet":"Granite Ancestor","cr":"10","sec":"Actions","row":"Sunken Blow","kind":"free row","text":"*Strength Saving Throw*: DC 17, each creature within 10 feet. *Failure:* The target has the Prone condition.","issue":"A Strength save to resist being knocked Prone is a static-force / body-mass check, which fits, but the name and placement suggest a targeted strike rather than an area effect; the stat-entry-fiction is mismatched for the claimed overhead maul feature."},{"id":"gate-retaliate-2026-11-11T19-31-36/01-bog-troll.md/Loathsome Limbs/103","run":"gate-retaliate-2026-11-11T19-31-36","sheet":"Bog Troll","cr":"5","sec":"Traits","row":"Loathsome Limbs (4/Day)","kind":"print","text":"If the bog troll ends any turn Bloodied and took 15+ Slashing damage during that turn, one of the bog troll's limbs is severed, falls into the bog troll's space, and becomes a Troll Limb. The limb acts immediately after the bog troll's turn. The bog troll has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points.","issue":"Comma before 'and becomes' creates a run-on after a 15-word introductory clause; not ungrammatical strictly, but the clause chain is hard to parse mid-combat."},{"id":"gate-spells-2026-11-10T04-02-56/04-grubnack-the-borrowed.md/Multiattack/107","run":"gate-spells-2026-11-10T04-02-56","sheet":"Grubnack the Borrowed","cr":"3","sec":"Actions","row":"Multiattack","kind":"chassis","text":"Grubnack makes two Arcane Burst attacks. It can replace one attack with a use of (A) Mocking Runes or (B) Spellcasting to cast *Magic Missile*.","issue":"The Multiattack references a Spellcasting action that also lists *Misty Step*, so which spell may be substituted is ambiguous without the parenthetical pin, and the label (A)/(B) is schema-like list syntax."},{"id":"gate-h-hold-2026-11-11T22-40-27/06-wreckcoil-eel.md/Bite/94","run":"gate-h-hold-2026-11-11T22-40-27","sheet":"Wreckcoil Eel","cr":"3","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 12 (2d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"The Grapple-into-Restrained clause has a written escape DC, so it carries proper counterplay; no defect."},{"id":"gate-b-engulf-2026-11-10T20-31-09/09-weed-saddled-drowner.md/Coaxing Whinny/19","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Weed-Saddled Drowner","cr":"4","sec":"Actions","row":"Coaxing Whinny","kind":"template","text":"*Wisdom Saving Throw:* DC 13, one creature within 60 feet that can see or hear the drowner. *Failure:* The target has the Charmed condition until the start of the drowner's next turn, and while Charmed this way, it must move toward the drowner by the safest available route on its turn.","issue":"The forced movement has no defined endpoint or distance, so a GM cannot determine when the compulsion is satisfied or whether the creature reaches the drowner."},{"id":"gate-b-engulf-2026-11-10T21-29-43/01-drowned-coil-eel.md/Drag Below/20","run":"gate-b-engulf-2026-11-10T21-29-43","sheet":"Drowned Coil Eel","cr":"3","sec":"Actions","row":"Drag Below","kind":"free row","text":"*Strength Saving Throw*: DC 13, one creature within 5 feet. *Failure:* The target is pulled up to 5 feet straight toward the coil eel, and the target has the Restrained condition until the end of its next turn.","issue":"Moving a target directly toward the eel is not adjudicable when the target occupies a space adjacent to it as required by the 5-foot range; no destination is definable."},{"id":"gate-c1-2026-11-10T07-24-12/05-grentok.md/Regeneration/34","run":"gate-c1-2026-11-10T07-24-12","sheet":"Grentok","cr":"6","sec":"Traits","row":"Regeneration","kind":"print","text":"Grentok regains 15 Hit Points at the start of each of its turns. If Grentok takes Acid or Fire damage, this trait doesn't function on Grentok's next turn. Grentok dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"'doesn't function on Grentok's next turn' is ambiguous about whether suppression covers only that single turn or persists while damage keeps landing, and a GM cannot resolve it against the standard 'at the start of the turn, suppress if damage since its last turn' template."},{"id":"sweep-2026-11-10T15-02-59/05-air-elemental.md/Thunderous Slam/129","run":"sweep-2026-11-10T15-02-59","sheet":"Air Elemental","cr":"5","sec":"Actions","row":"Thunderous Slam","kind":"print","text":"*Melee Attack Roll:* +8, reach 10 ft. 14 (2d8 + 5) Thunder damage.","issue":"Neither name matches the damage type: the entry is called Thunderous Slam and deals Thunder damage, consistent, but the element is an air elemental whose signature is wind; not a defect."},{"id":"gate-h-hold-2026-11-11T22-13-22/01-cave-roper.md/Ceiling Lurk/92","run":"gate-h-hold-2026-11-11T22-13-22","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Ceiling Lurk","kind":"free row","text":"When the roper hits a creature with a Bite attack while hanging from a ceiling or cliff, the target has the Grappled condition (escape DC 15) and is pulled up to 10 feet straight toward the roper; the grapple ends when the target escapes with a successful Strength (Athletics) or Dexterity (Acrobatics) check against the DC.","issue":"The trait bundles a climb benefit, a Bite-triggered pull, and an undefined grapple into one conditional clause requiring the GM to track the anchored state."},{"id":"gate-b-engulf-2026-11-10T19-44-57/05-silt-maw.md/Mud-Dragging Lunge/1","run":"gate-b-engulf-2026-11-10T19-44-57","sheet":"Silt Maw","cr":"1","sec":"Actions","row":"Mud-Dragging Lunge","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 10 feet straight toward the silt maw, and the target has the Prone condition.","issue":"The cone's origin/placement is unspecified (no statement it originates from the silt maw), leaving the GM unable to determine which creatures are targeted."},{"id":"gate-b-engulf-2026-11-10T20-10-11/10-mire-drowner.md/Spellcasting/7","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Mire Drowner","cr":"6","sec":"Actions","row":"Spellcasting","kind":"print","text":"The drowner casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 14):\n\n- **At Will:** *Detect Magic*, *Light*, *Mage Armor*, *Mage Hand*, *Prestidigitation*\n- **2/Day Each:** *Fireball*, *Invisibility*\n- **1/Day Each:** *Cone of Cold*, *Fly*","issue":"The spell list includes spells with no attack roll or save (Mage Armor, Fly, Invisibility, Light, etc.), so 'one of the following spells' is not a complete casting procedure and the GM must infer an action cost list."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/87","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The feature name 'Siltborn Passage' promises the mire closing over/engulfing victims, but the text only halves Speed and never restrains, grapples, or engulfs anything."},{"id":"gate-h-hold-2026-11-11T15-25-20/12-siltclutch-spawn.md/Multiattack/70","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Siltclutch Spawn","cr":"6","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The spawn makes two Grasping Tentacles attacks. It can replace one attack with a use of Horrid Display.","issue":"Horrid Display is presented as a follow-up effect but its trigger/timing is unstated and it is also listed as a standalone action, making its use within Multiattack ambiguous."},{"id":"probe-repair2-2026-11-10T14-46-14/09-daubjaw.md/Swallow/125","run":"probe-repair2-2026-11-10T14-46-14","sheet":"Daubjaw","cr":"5","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The daubjaw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the daubjaw, and takes 7 (2d6) Acid damage at the start of each of the daubjaw's turns. The daubjaw can have only one creature swallowed at a time. If the daubjaw takes 15 damage or more in a single turn from the swallowed creature, the daubjaw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 5 feet of the daubjaw. If the daubjaw dies, a swallowed creature exits the body Prone by using 5 feet of movement.","issue":"The regurgitation trigger and exit placement are linear and usable, but combined with the damage-at-start-of-its-turns and no reach spec, the GM must track which turn, whose turn, and whether the swallowed creature could even land 15 damage — the procedure is resolvable but ambiguous on attack reach while swallowed."},{"id":"gate-b-engulf-2026-11-10T20-20-36/01-gelatinous-cube.md/Ooze Cube/9","run":"gate-b-engulf-2026-11-10T20-20-36","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Ooze Cube","kind":"print","text":"Cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to Cube's Engulf and has Disadvantage on the saving throw.\nCreatures inside Cube have Total Cover, and Cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time.\nAs an action, a creature within 5 feet of Cube can pull a creature or an object out of Cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","issue":"Creatures engulfed inside the cube are described as having Total Cover, but the Engulf action's own escape and half-damage text assumes they can be attacked or observed; Total Cover blocks targeting and line of sight, which contradicts the escape/Acid tick structure that presumes the engulfed creature remains an active targetable participant."},{"id":"gate-h-hold-2026-11-11T20-20-08/06-channel-stalker.md/Creeping Dread/82","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Channel Stalker","cr":"3","sec":"Actions","row":"Creeping Dread","kind":"template","text":"*Wisdom Saving Throw:* DC 13, one creature within 60 feet. *Failure:* The target has the Frightened condition until the end of the stalker's next turn. If the target was already Frightened by this ability, it also takes 13 (3d8) Psychic damage.","issue":"Entry name 'Creeping Dread' is generic and does not express the channel/ambush-horror concept of this creature; name and mechanics disagree in register."},{"id":"gate-b-engulf-2026-11-10T21-33-18/01-drowned-larder-crocodile.md/Jaws Lock/22","run":"gate-b-engulf-2026-11-10T21-33-18","sheet":"Drowned Larder Crocodile","cr":"2","sec":"Actions","row":"Jaws Lock","kind":"free row","text":"*Strength Saving Throw*: DC 13, one creature within 5 feet. *Failure:* The target is pulled up to 5 feet straight toward the larder crocodile, and the target has the Grappled condition (escape DC 13).","issue":"Jaws Lock is described as seizing and dragging a creature, but the forced movement is toward the crocodile rather than away/down — the pull direction contradicts the 'lock' fiction and duplicates Bite's grapple without adding the drag it promises."},{"id":"gate-h-hold-2026-11-11T20-20-08/01-gelatinous-cube.md/Ooze Cube/76","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Ooze Cube","kind":"print","text":"Cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to Cube's Engulf and has Disadvantage on the saving throw.\nCreatures inside Cube have Total Cover, and Cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time.\nAs an action, a creature within 5 feet of Cube can pull a creature or an object out of Cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","issue":"The pull-out clause is the only written escape for the Large-creature capacity restriction, but the Engulf action already gives engulfed creatures their own escape check; having two competing escape procedures with no stated interaction makes adjudication ambiguous."},{"id":"gate-savefit-2026-11-10T15-28-09/01-tar-creeper.md/Burning Slick/104","run":"gate-savefit-2026-11-10T15-28-09","sheet":"Tar Creeper","cr":"4","sec":"Traits","row":"Burning Slick","kind":"free row","text":"Once per turn, a creature is struck by the tar creeper's Molten Fist or starts its turn within 5 feet of the tar creeper, the creature catches fire and takes 7 (2d6) Fire damage at the start of each of its turns until it or another creature within 5 feet of it spends an action smothering the flames.","issue":"The ongoing fire has a rules-legal escape (action to smother) but the smothering fails to specify that the smothering creature must be able to reach/touch the burning creature, leaving adjacency alone as the only condition."},{"id":"gate-type-2026-11-10T18-56-12/02-tolling-warden.md/Multiattack/112","run":"gate-type-2026-11-10T18-56-12","sheet":"Tolling Warden","cr":"3","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The warden makes two Withering Touch attacks. It can replace one attack with a use of Funeral Toll.","issue":"Lowercase sentence start is exempt from reporting; skipped per calibration."},{"id":"gate-b-engulf-2026-11-10T21-30-34/01-sand-maw.md/Swallow/21","run":"gate-b-engulf-2026-11-10T21-30-34","sheet":"Sand-Maw","cr":"9","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The sand-maw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the sand-maw, and takes 10 (3d6) Acid damage at the start of each of the sand-maw's turns. The sand-maw can have only one creature swallowed at a time. If the sand-maw takes 25 damage or more on a single turn from the swallowed creature, the sand-maw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the sand-maw. If the sand-maw dies, a swallowed creature exits the body Prone by using 10 feet of movement.","issue":"The entry uses 'grappling,' whereas the Bite entry uses the 2024-style 'Grappled condition' phrasing; this is a mixed-format reference to a condition, which can cause adjudication ambiguity."},{"id":"gate-h-hold-2026-11-11T15-25-20/09-sandmaw.md/Swallow/67","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Sandmaw","cr":"9","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The sandmaw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the sandmaw, and takes 10 (3d6) Acid damage at the start of each of the sandmaw's turns. The sandmaw can have only one creature swallowed at a time. If the sandmaw takes 25 damage or more on a single turn from the swallowed creature, the sandmaw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the sandmaw. If the sandmaw dies, a swallowed creature exits the body Prone by using 10 feet of movement.","issue":"The only non-damage escape from being swallowed is gated on the sandmaw's death and requires the swallowed creature to spend movement; a swallowed creature with 0 speed or no movement available has no rules-legal path out while the sandmaw lives."},{"id":"gate-type-2026-11-10T18-56-12/01-chapel-bell-ringer-s-ghost.md/Multiattack/111","run":"gate-type-2026-11-10T18-56-12","sheet":"Chapel Bell-Ringer's Ghost","cr":"3","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The ghost makes two Withering Touch attacks. It can replace one attack with a use of Toll for the Dying.","issue":"Toll for the Dying is a 60-foot Emanation affecting all creatures, so 'a use of' it as one of two attacks gives no indication of how its area interacts with the two-attack budget."},{"id":"gate-spells-2026-11-10T04-02-56/07-lich.md/Disrupt Life/110","run":"gate-spells-2026-11-10T04-02-56","sheet":"Lich","cr":"21","sec":"Legendary Actions","row":"Disrupt Life","kind":"print","text":"*Constitution Saving Throw*: DC 20, each creature that isn't an Undead in a 20-foot Emanation originating from the lich. *Failure:*  31 (9d6) Necrotic damage. *Success:*  Half damage. *Failure or Success*:  the lich can't take this action again until the start of its next turn.","issue":"Failure or Success clause uses lowercase subject and doubled spacing; also 'Failure or Success' as an outcome label for a recharge gate is awkward phrasing."},{"id":"gate-h-hold-2026-11-11T05-44-38/10-cave-roper.md/Wall Anchored/59","run":"gate-h-hold-2026-11-11T05-44-38","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Wall Anchored","kind":"free row","text":"While anchored to a wall, the cave roper can use a Bonus Action to pull a Grappled creature it can see within its reach directly toward its maw; when a creature enters a space within 5 feet of its hide using its own movement, it must succeed on a DC 14 save or have the Prone condition until it spends movement to stand.","issue":"The Prone imposition is automatic with no save and no distance the creature can avoid; a creature without movement available to stand remains Prone indefinitely with no rules path out on that turn."},{"id":"gate-h-hold-2026-11-11T05-22-56/05-ford-bend-maw.md/Undertow Lunge/52","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Ford-Bend Maw","cr":"2","sec":"Actions","row":"Undertow Lunge","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 10 feet straight toward the maw, and the target has the Prone condition.","issue":"The pull is 'up to 10 feet straight toward' a direction that depends on the maw's position relative to each target in the cone; with multiple creatures in a 15-foot cone at varying angles, the GM must adjudicate per-target vectors and stop positions, which is fiddly mid-combat."},{"id":"gate-h-hold-2026-11-11T20-20-08/12-brineclutch-spawnling.md/Brineclutch Haul/91","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Brineclutch Spawnling","cr":"6","sec":"Actions","row":"Brineclutch Haul","kind":"template","text":"*Strength Saving Throw:* DC 14, one creature within 30 feet. *Failure:* The target is pulled up to 25 feet straight toward the spawnling by a long grasping tentacle and has the Grappled condition (escape DC 15).","issue":"The Grappled condition grants its own escape (per the general Grappled rule, a creature can escape with an ability check against the escape DC), but the Haul line grants no repeat save or check written in the entry for the movement itself, plus the target shares the spawnling's square economy by being pulled 25 ft. without any opportunity to resist the forced movement portion — the effect is packaged as a single save that, on failure, both moves and restrains (Grappled) with no "},{"id":"gate-type-2026-11-10T18-56-12/06-altar-vigil.md/Emptied Temple/116","run":"gate-type-2026-11-10T18-56-12","sheet":"Altar Vigil","cr":"6","sec":"Traits","row":"Emptied Temple","kind":"free row","text":"At the start of each of the vigil's turns, if it is Bloodied or a creature it can see has been reduced to 0 Hit Points since its last turn, the vigil regains 11 (2d10) Hit Points and has Advantage on its next attack roll.","issue":"The heal value is stated as 11 (2d10), but 2d10 averages 11; however, the phrasing \"11 (2d10)\" is the standard dice-average parenthetical, so this is not a defect. The real concern is that the trait has no cap or usage limit, allowing infinite healing when the condition triggers every turn."},{"id":"gate-h-hold-2026-11-11T05-22-56/01-gelatinous-cube.md/Corrosive Form/50","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Corrosive Form","kind":"chassis","text":"A creature that touches Cube or hits it with a melee attack while within 5 feet of it takes 5 (1d10) Acid damage.","issue":"This is an always-on, unavoidable damage rider with no save, attack roll, or reaction; a player has no rules-legal means of touching or melee-attacking Cube without taking damage, so it is an imposed effect with no counterplay clause."},{"id":"gate-spells-2026-11-10T04-02-56/07-lich.md/Multiattack/109","run":"gate-spells-2026-11-10T04-02-56","sheet":"Lich","cr":"21","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The lich makes three attacks, using Eldritch Burst or Paralyzing Touch in any combination.","issue":"Lowercase subject opening the sentence, garbled prose."},{"id":"gate-c1-2026-11-10T07-24-12/09-goblin-boss.md/Scimitar/37","run":"gate-c1-2026-11-10T07-24-12","sheet":"Goblin Boss","cr":"1","sec":"Actions","row":"Scimitar","kind":"print","text":"*Melee Attack Roll:* +4, reach 5 ft. 5 (1d6 + 2) Slashing damage plus 2 (1d4) Slashing damage if the attack roll had Advantage.","issue":"The Multiattack entry is misnomered under Scimitar in the block's section ordering only if named wrong; here the real issue is no Scimitar span — skipping."},{"id":"sweep-2026-11-10T15-02-59/05-air-elemental.md/Stolen Scream/128","run":"sweep-2026-11-10T15-02-59","sheet":"Air Elemental","cr":"5","sec":"Actions","row":"Stolen Scream","kind":"template","text":"*Wisdom Saving Throw:* DC 13, one creature within 60 feet. *Failure:* The target has the Frightened condition until the end of its next turn. If the target was already Frightened by this ability, it also takes 9 (2d8) Thunder damage.","issue":"The frightened condition from this ability ends at the end of the target's next turn, and the ability is a single-target save with no way to be Frightened by it before this resolution, so the rider is dead unless a target is somehow affected twice."},{"id":"gate-h-hold-2026-11-11T15-23-20/01-sand-maw.md/Swallow/61","run":"gate-h-hold-2026-11-11T15-23-20","sheet":"Sand Maw","cr":"9","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The maw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the maw, and takes 10 (3d6) Acid damage at the start of each of the maw's turns. The maw can have only one creature swallowed at a time. If the maw takes 25 damage or more on a single turn from the swallowed creature, the maw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the maw. If the maw dies, a swallowed creature exits the body Prone by using 10 feet of movement.","issue":"The regurgitation clause says the maw 'must' regurgitate, but nothing states what happens (or whether it can decline) if the maw is reduced to 0 HP by that damage before the end of the turn, leaving the swallow end-state undefined at the moment of death."},{"id":"gate-spells-2026-11-10T04-02-56/05-nib-wickwhistle.md/Spark Lance/108","run":"gate-spells-2026-11-10T04-02-56","sheet":"Nib Wickwhistle","cr":"3","sec":"Actions","row":"Spark Lance","kind":"template","text":"*Constitution Saving Throw:* DC 12, one creature within 60 feet. *Failure:* The target has the Blinded condition until the end of its next turn.","issue":"None — Blinded carries a fixed end condition and this is fine; do not flag. "},{"id":"sweep-2026-11-10T15-02-59/12-plague-archon-of-flies.md/Chitin Forelimb/130","run":"sweep-2026-11-10T15-02-59","sheet":"Plague Archon of Flies","cr":"13","sec":"Actions","row":"Chitin Forelimb","kind":"chassis","text":"*Melee Attack Roll:* +10, reach 5 ft. 18 (3d8 + 5) Slashing damage plus 13 (3d8) Poison damage.","issue":"The attack name promises a chitinous forelimb that deals Slashing, but the poison damage has no shared physical cause with the limb and no delivery vector is described, making the two damage types narratively disjoint on one appendage."},{"id":"gate-c1-2026-11-10T05-19-21/05-bridge-troll.md/Regeneration/31","run":"gate-c1-2026-11-10T05-19-21","sheet":"Bridge Troll","cr":"6","sec":"Traits","row":"Regeneration","kind":"print","text":"The bridge troll regains 15 Hit Points at the start of each of its turns. If the bridge troll takes Acid or Fire damage, this trait doesn't function on the bridge troll's next turn. The bridge troll dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"This is a standard troll regeneration suppression clause, not a defect; treated as non-actionable but noted for completeness."},{"id":"gate-b-engulf-2026-11-10T20-10-11/06-rivergrip-lurker.md/Jaws/5","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Rivergrip Lurker","cr":"2","sec":"Actions","row":"Jaws","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 7 (1d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition. If the lurker moved at least 20 feet straight toward the target immediately before the hit and the target is Large or smaller, the target has the Prone condition, and the lurker can make one Jaws attack against it as a Bonus Action.","issue":"2014-format condition phrasing ('has the Grappled condition' with a bare DC) instead of the 2024 'is Grappled (escape DC 13)' form; 'has the X condition' recurs throughout the block."},{"id":"gate-b-engulf-2026-11-11T01-44-51/01-murk-lurker.md/Trample/26","run":"gate-b-engulf-2026-11-11T01-44-51","sheet":"Murk Lurker","cr":"2","sec":"Actions","row":"Trample (Recharge 5-6)","kind":"template","text":"The lurker moves up to its Speed without provoking Opportunity Attacks and can move through the spaces of Medium or smaller creatures. Each creature whose space it enters is targeted once by the following effect. *Dexterity Saving Throw*: DC 13. *Failure:* 7 (2d6) Bludgeoning damage, and the target has the Prone condition.","issue":"The trample movement grants no path out for a creature that ends its move overlapping a hostile space if the target succeeds on the save or is not moved, and the block never resolves what happens to a creature whose space the lurker stays in."},{"id":"gate-c1-2026-11-10T07-24-12/10-displacer-stalker.md/Tentacles/38","run":"gate-c1-2026-11-10T07-24-12","sheet":"Displacer Stalker","cr":"3","sec":"Actions","row":"Tentacles","kind":"authored","text":"*Melee Attack Roll:* +5 (with Advantage during the first round of each combat), reach 5 ft. 7 (1d8 + 3) Bludgeoning damage plus 5 (1d10) Psychic damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 11). If the target already has the Grappled condition, the Grappled condition on the target lasts until the end of the stalker's next turn.","issue":"The clause affixes an end-time to a Grappled condition that otherwise carries its own escape (DC 11) and can only be reached by hitting an already-Grappled target, but the reach 5 ft. single-target structure means the second clause never overrides the escape DC in a way a GM can reconcile mid-turn."},{"id":"gate-savefit-2026-11-10T15-28-09/04-vigil-warden.md/Shield Bash/106","run":"gate-savefit-2026-11-10T15-28-09","sheet":"Vigil Warden","cr":"6","sec":"Actions","row":"Shield Bash","kind":"print","text":"*Strength Saving Throw*: DC 15, one creature within 5 feet that the warden can see. *Failure:*  9 (2d4 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.","issue":"The Prone condition is applied without a duration, and while Prone has its own exit by standing up, the entry does not specify that the target can use movement to stand; official statblock entries usually include no duration for Prone, but the phrasing 'it has the Prone condition' is standard and acceptable."},{"id":"gate-b-engulf-2026-11-11T02-19-26/08-bog-lurker.md/Regeneration/28","run":"gate-b-engulf-2026-11-11T02-19-26","sheet":"Bog Lurker","cr":"5","sec":"Traits","row":"Regeneration","kind":"print","text":"The bog lurker regains 15 Hit Points at the start of each of its turns. If the bog lurker takes Acid or Fire damage, this trait doesn't function on the bog lurker's next turn. The bog lurker dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"Stray lowercase mid-sentence detracts from statblock prose but is capped by format rules—only flagging the doubled/one-word sentences."},{"id":"gate-h-hold-2026-11-11T05-44-38/07-under-muck-troll.md/Multiattack/58","run":"gate-h-hold-2026-11-11T05-44-38","sheet":"Under-Muck Troll","cr":"5","sec":"Actions","row":"Multiattack","kind":"chassis","text":"The troll makes three Rend attacks. It can replace one attack with a use of Muck Maw.","issue":"Lowercase sentence start in entry text."},{"id":"gate-h-hold-2026-11-11T20-20-08/05-crossing-lurker.md/Merciless Strike/81","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Crossing Lurker","cr":"2","sec":"Actions","row":"Merciless Strike (Recharge 5-6)","kind":"template","text":"The lurker strikes where the target cannot guard. *Dexterity Saving Throw*: DC 13, one creature within 30 feet. *Failure:* 7 (2d6) Bludgeoning damage. If the target already has the Grappled condition, it also has the Prone condition. *Success:* Half damage.","issue":"(Recharge 5-6) The name is generic and does not fit this creature's ambush-from-the-water concept."},{"id":"gate-h-hold-2026-11-11T15-25-20/09-sandmaw.md/Swallow/66","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Sandmaw","cr":"9","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The sandmaw swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the sandmaw, and takes 10 (3d6) Acid damage at the start of each of the sandmaw's turns. The sandmaw can have only one creature swallowed at a time. If the sandmaw takes 25 damage or more on a single turn from the swallowed creature, the sandmaw must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the sandmaw. If the sandmaw dies, a swallowed creature exits the body Prone by using 10 feet of movement.","issue":"The sandwiched turn-order condition (damage taken 'on a single turn' but regurgitation at the end of that turn) plus the separate death-exit clause forces the GM to track cumulative per-turn damage against a threshold while resolving the target's own turn, which is not resolvable quickly mid-combat."},{"id":"gate-retaliate-2026-11-11T19-19-28/03-vess-ardaine.md/Iron-Bound Blade/101","run":"gate-retaliate-2026-11-11T19-19-28","sheet":"Vess Ardaine","cr":"5","sec":"Traits","row":"Iron-Bound Blade","kind":"free row","text":"When Vess would be reduced to 0 Hit Points, the rapier shatters and Vess instead drops to 1 Hit Point; it reforms when she completes a Short Rest.","issue":"The GM must track the depleted 'shattered' state across multiple encounters (before a Short Rest), with no reminder mechanic beyond the trait text; while minor, the short-rest recovery is a state the block gives no tracking hook for."},{"id":"gate-h-hold-2026-11-11T22-40-27/07-fenmuck-grask.md/Loathsome Limbs/96","run":"gate-h-hold-2026-11-11T22-40-27","sheet":"Fenmuck Grask","cr":"5","sec":"Traits","row":"Loathsome Limbs (4/Day)","kind":"print","text":"If the fenmuck grask ends any turn Bloodied and took 15+ Slashing damage during that turn, one of the fenmuck grask's limbs is severed, falls into the fenmuck grask's space, and becomes a Troll Limb. The limb acts immediately after the fenmuck grask's turn. The fenmuck grask has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points.","issue":"(4/Day) Sentence begins mid-flow after the prior sentence and is not capitalized as a new sentence."},{"id":"probe-repair2-2026-11-10T08-37-15/02-mother-ash.md/Smother/120","run":"probe-repair2-2026-11-10T08-37-15","sheet":"Mother Ash","cr":"9","sec":"Bonus Actions","row":"Smother","kind":"chassis","text":"The ash smothers one Medium or smaller creature it is grappling. While smothered, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the ash, and takes 10 (3d6) Necrotic damage at the start of each of the ash's turns. The ash can have only one creature smothered at a time. If the ash takes 25 damage or more on a single turn from the smothered creature, the ash must release the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the ash. If the ash dies, a smothered creature pulls free Prone by using 10 feet of movement.","issue":"The Smother entry piles multiple simultaneous effects (Blinded, Restrained, Total Cover, recurring damage) with separate tracking and conditional release into a single bonus action, making it hard to resolve in a standard combat round without referencing several rules at once."},{"id":"gate-h-hold-2026-11-11T20-20-08/10-cave-roper.md/Tendril/90","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Cave Roper","cr":"5","sec":"Actions","row":"Tendril","kind":"chassis","text":"*Melee Attack Roll:* +6, reach 5 ft. 16 (3d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14). While Grappled, the target has the Restrained condition.","issue":"The Restrained condition is bolted onto the Grappled target with no stated separate exit beyond the escape DC; since Tendril only strips Restrained while Grappled, a GM cannot tell whether escaping only the Grapple also ends Restrained or whether a second check is needed."},{"id":"gate-type-2026-11-10T18-56-12/02-tolling-warden.md/Possession/113","run":"gate-type-2026-11-10T18-56-12","sheet":"Tolling Warden","cr":"3","sec":"Actions","row":"Possession (Recharge 6)","kind":"print","text":"*Charisma Saving Throw*: DC 13, one Humanoid the warden can see within 5 feet. *Failure:*  The target is possessed by the warden; the warden disappears, and the target has the Incapacitated condition and loses control of its body. The warden now controls the body, but the target retains awareness. The warden can't be targeted by any attack, spell, or other effect, except ones that specifically target Undead. The warden's game statistics are the same, except it uses the possessed target's Speed, as well as the target's Strength, Dexterity, and Constitution modifiers.\nThe possession lasts until the body drops to 0 Hit Points or the warden leaves as a Bonus Action. When the possession ends, the warden appears in an unoccupied space within 5 feet of the target, and the target is immune to this ghost's Possession for 24 hours. *Success:*  The target is immune to this ghost's Possession for 24 hours.","issue":"Garbled lowercase sentence starts and stray mid-sentence lowercase are excluded from review by instruction; no reportable garble present."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/84","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The entry opens with a dangling 'When...' trigger that governs no consequence, yet it also asserts two unconditional activities (treating difficult ground as open ground, leaving no tracks), so the GM cannot tell what the trigger actually gates."},{"id":"gate-h-hold-2026-11-11T05-44-38/03-pond-gulper.md/Bite/57","run":"gate-h-hold-2026-11-11T05-44-38","sheet":"Pond Gulper","cr":"1","sec":"Actions","row":"Bite","kind":"print","text":"*Melee Attack Roll:* +4, reach 5 ft. 6 (1d8 + 2) Piercing damage. While Grappled, the target has the Restrained condition. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 12).","issue":"The 'While Grappled' conditional is detached and ambiguous — it does not specify grappled by whom, and it overlaps confusingly with the subsequent Grappled application, forcing the GM to parse branching state mid-combat."},{"id":"gate-b-engulf-2026-11-10T23-37-26/06-underwater-crocodile.md/Swallow/24","run":"gate-b-engulf-2026-11-10T23-37-26","sheet":"Underwater Crocodile","cr":"2","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The crocodile swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the crocodile, and takes 3 (1d6) Acid damage at the start of each of the crocodile's turns. The crocodile can have only one creature swallowed at a time. If the crocodile takes 6 damage or more in a single turn from the swallowed creature, the crocodile must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 5 feet of the crocodile. If the crocodile dies, a swallowed creature exits the body Prone by using 5 feet of movement.","issue":"The swallow prerequisite requires the target to be Grappled at the start of the bonus action, but nothing in the block ensures a Grappled creature survives the intervening space between the crocodile's turn and this bonus action being spendable (it is a bonus action, so it follows the Attack action in the same turn); the timing of the grapple-to-swallow transition is unspecified when the grapple was applied by Bite on the same turn."},{"id":"gate-b-engulf-2026-11-10T20-20-36/12-dunegullet.md/Bite/12","run":"gate-b-engulf-2026-11-10T20-20-36","sheet":"Dunegullet","cr":"9","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +11, reach 15 ft. 34 (6d8 + 7) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 16). While Grappled, the target has the Restrained condition.","issue":"The Restrained condition is applied only 'while Grappled,' but the Grappled condition already carries its own escape (DC 16) and the block never states a duration or end condition for the Restrained rider, making the Restrained application's duration undefined and implying it lifts the moment Grapple ends—yet nothing says so explicitly for a GM adjudicating Restrained's own effects."},{"id":"gate-h-hold-2026-11-11T17-08-23/12-brine-coil.md/Grasping Tentacles/75","run":"gate-h-hold-2026-11-11T17-08-23","sheet":"Brine Coil","cr":"6","sec":"Actions","row":"Grasping Tentacles","kind":"authored","text":"*Melee Attack Roll:* +7, reach 5 ft. 13 (2d8 + 4) Bludgeoning damage plus 7 (2d6) Cold damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 15). If the coil moved at least 20 feet straight toward the target immediately before the hit and the target is Large or smaller, the target has the Prone condition, and the coil can make one Grasping Tentacles attack against it as a Bonus Action.","issue":"The Bonus Action follow-up is triggered off a hit but the trigger clause has no duration or end condition tying the held state, and the Grappled-escape from the same hit doesn't govern the Prone follow-up, so the GM cannot tell whether a creature that escaped the grapple can still be struck by the granted Bonus Action."},{"id":"gate-b-engulf-2026-11-10T19-44-57/06-oxbow-sinker.md/Bite/2","run":"gate-b-engulf-2026-11-10T19-44-57","sheet":"Oxbow Sinker","cr":"2","sec":"Actions","row":"Bite","kind":"print","text":"*Melee Attack Roll:* +5, reach 5 ft. 12 (2d8 + 3) Piercing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"This rider applies Restrained to a target that is Grappled, but Drag Under also imposes Grappled without granting Restrained, making the interaction between the two grapple sources inconsistent and ambiguous."},{"id":"gate-h-hold-2026-11-11T15-25-20/10-gullet-ledge-roper.md/Stonefoot Anchor/68","run":"gate-h-hold-2026-11-11T15-25-20","sheet":"Gullet Ledge Roper","cr":"5","sec":"Traits","row":"Stonefoot Anchor","kind":"free row","text":"While the ledge roper is anchored to stone, the ledge roper climbs sheer stone without an ability check, and it cannot be moved against its will by any effect that would push, pull, or knock it from its perch.","issue":"The name 'Stonefoot Anchor' promises a rooting/anchoring mechanic, but its rules only grant climbing and push-immunity; nothing anchors it or prevents forced movement via Reel-style pull effects on itself, so the name overpromises."},{"id":"probe-repair-2026-11-10T08-34-18/04-mother-ash.md/Smother/119","run":"probe-repair-2026-11-10T08-34-18","sheet":"Mother Ash","cr":"9","sec":"Bonus Actions","row":"Smother","kind":"chassis","text":"Mother Ash smothers one Medium or smaller creature it is grappling. While smothered, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside Mother Ash, and takes 10 (3d6) Necrotic damage at the start of each of Mother Ash's turns. Mother Ash can have only one creature smothered at a time. If Mother Ash takes 25 damage or more on a single turn from the smothered creature, Mother Ash must release the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of Mother Ash. If Mother Ash dies, a smothered creature pulls free Prone by using 10 feet of movement.","issue":"The exit puts the target in an unoccupied space, but nothing states whether that space is chosen by Mother Ash or the target, leaving a contested adjudication at the table."},{"id":"gate-h-hold-2026-11-11T05-22-56/01-gelatinous-cube.md/Ooze Cube/51","run":"gate-h-hold-2026-11-11T05-22-56","sheet":"Gelatinous Cube","cr":"2","sec":"Traits","row":"Ooze Cube","kind":"print","text":"Cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to Cube's Engulf and has Disadvantage on the saving throw.\nCreatures inside Cube have Total Cover, and Cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time.\nAs an action, a creature within 5 feet of Cube can pull a creature or an object out of Cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","issue":"The trait grants Total Cover to contained creatures but gives no timing for when a creature is 'inside' versus merely in Cube's space, and it references an object capacity for the pull clause without stating how many objects Cube can hold."},{"id":"gate-type-2026-11-10T18-56-12/05-brass-chaplain.md/Divine Aid/115","run":"gate-type-2026-11-10T18-56-12","sheet":"Brass Chaplain","cr":"4","sec":"Bonus Actions","row":"Divine Aid (3/Day)","kind":"print","text":"The brass chaplain casts *Bless*, *Dispel Magic*, *Healing Word*, or *Lesser Restoration*, using the same spellcasting ability as Spellcasting.","issue":"(3/Day) This 3/Day bonus action duplicates the Spellcasting trait's method and re-declares the casting ability already established there, reading as a redundant second casting entry rather than a distinct ability."},{"id":"gate-c1-2026-11-10T05-19-21/10-offset-cat.md/Blurred Form/32","run":"gate-c1-2026-11-10T05-19-21","sheet":"Offset Cat","cr":"3","sec":"Traits","row":"Blurred Form","kind":"template","text":"Attack rolls against the offset cat have Disadvantage. If the offset cat is hit by an attack roll, this trait is disabled until the end of its next turn.","issue":"The trigger state (being hit by an attack roll) and the reset timing are clear, but the clause does not say whether the trait re-enables immediately at the start of the cat's next turn while the current attack is being resolved; a GM cannot determine whether later attacks in the same round still suffer Disadvantage."},{"id":"gate-type-2026-11-10T18-56-12/03-passwind-strayer.md/Unarmed Strike/114","run":"gate-type-2026-11-10T18-56-12","sheet":"Passwind Strayer","cr":"5","sec":"Actions","row":"Unarmed Strike","kind":"print","text":"*Melee Attack Roll:* +6, reach 5 ft. 21 (4d8 + 3) Bludgeoning damage. Once on each of the strayer's turns when it hits with this attack, the target is subjected to the following effect. *Constitution Saving Throw*: DC 13. *Failure:* The target has the Stunned condition until the end of the strayer's next turn.","issue":"Stunned is imposed with a fixed end at the end of the strayer's next turn, but the target makes its save at hit time; if the strayer dies or is removed before that point, the GM has no rule telling whether the Stunned persists to its stated expiry."},{"id":"gate-c1-2026-11-10T07-36-46/01-goblin-boss.md/Multiattack/40","run":"gate-c1-2026-11-10T07-36-46","sheet":"Goblin Boss","cr":"1","sec":"Actions","row":"Multiattack","kind":"print","text":"The boss makes two attacks, using Scimitar or Shortbow in any combination.","issue":"Lowercase sentence-initial word is a capitalization error, but capitalization is explicitly excluded from reporting — flagged here only if the deterministic pass would not catch a mid-sentence lowercase generic referent."},{"id":"gate-type-2026-11-10T18-56-12/06-altar-vigil.md/Aura of Authority/117","run":"gate-type-2026-11-10T18-56-12","sheet":"Altar Vigil","cr":"6","sec":"Traits","row":"Aura of Authority","kind":"chassis","text":"While in a 10-foot Emanation originating from the vigil, the vigil and its allies have Advantage on attack rolls and saving throws, provided the vigil doesn't have the Incapacitated condition.","issue":"The aura grants advantage to allies but has no clause for what happens if the vigil moves or is forced to move; also, the phrase \"while in a 10-foot Emanation\" is ambiguously worded—does it mean while the creature is within the area, or while the aura is active?"},{"id":"gate-b-engulf-2026-11-10T20-31-09/08-muckhold-troll.md/Regeneration/18","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Muckhold Troll","cr":"5","sec":"Traits","row":"Regeneration","kind":"print","text":"The troll regains 15 Hit Points at the start of each of its turns. If the troll takes Acid or Fire damage, this trait doesn't function on the troll's next turn. The troll dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"Lowercase sentence start is cosmetic, but the doubled-context clause leaves ambiguous phrasing after the prior sentence; the span reads as a detached fragment lacking connective grammar."},{"id":"gate-h-hold-2026-11-11T20-20-08/08-mire-widow.md/Siltborn Passage/86","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Widow","cr":"6","sec":"Traits","row":"Siltborn Passage","kind":"free row","text":"When a creature ends its turn within the wet ground the widow moved through on the same turn, the widow treats swamp, mud, and standing water as open ground and leaves no tracks in wet earth, and a creature that ends its turn in the wet ground she passed through that turn has its Speed halved until the end of its next turn.","issue":"The statblock refers to itself as 'the widow' and 'she' rather than by its own entry name, an inconsistent referent."},{"id":"gate-b-engulf-2026-11-10T20-31-09/07-drowned-lure-eel.md/Drag Below/17","run":"gate-b-engulf-2026-11-10T20-31-09","sheet":"Drowned Lure Eel","cr":"3","sec":"Actions","row":"Drag Below","kind":"free row","text":"*Strength Saving Throw*: DC 13, each creature in a 15-foot Cone. *Failure:* The target is pulled up to 10 feet straight toward the lure eel, and the target has the Prone condition.","issue":"Straight-line pull toward the eel is direction-ambiguous for a 15-foot cone and can produce nonadjacent placement, leaving the GM unable to resolve the forced movement."},{"id":"gate-b-engulf-2026-11-10T23-37-26/06-underwater-crocodile.md/Swallow/23","run":"gate-b-engulf-2026-11-10T23-37-26","sheet":"Underwater Crocodile","cr":"2","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The crocodile swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the crocodile, and takes 3 (1d6) Acid damage at the start of each of the crocodile's turns. The crocodile can have only one creature swallowed at a time. If the crocodile takes 6 damage or more in a single turn from the swallowed creature, the crocodile must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 5 feet of the crocodile. If the crocodile dies, a swallowed creature exits the body Prone by using 5 feet of movement.","issue":"GP cannot resolve mid-combat: regurgitation is triggered at the end of the crocodile's turn based on damage tracked across the whole turn, and the exit requires choosing an unoccupied space—state that is unmanaged by the block."},{"id":"gate-retaliate-2026-11-11T19-10-29/04-calderak.md/Searing Hide/98","run":"gate-retaliate-2026-11-11T19-10-29","sheet":"Calderak","cr":"6","sec":"Traits","row":"Searing Hide","kind":"template","text":"A creature that touches the calderak or hits it with a melee attack while within 5 feet of it takes 7 (2d6) Fire damage.","issue":"No adjudication layer defect is present in the trait itself; however the Reaction 'Molten Backhand' is triggered by a melee attack roll that also triggers Searing Hide, and nothing in the block distinguishes a hit that triggers both — not a defect, this is standard overlap and is out of scope."},{"id":"sweep-2026-11-10T15-02-59/04-funeral-bell-wraith.md/Last Breath, Tolled Home/127","run":"sweep-2026-11-10T15-02-59","sheet":"Funeral Bell Wraith","cr":"3","sec":"Traits","row":"Last Breath, Tolled Home","kind":"free row","text":"When the bell wraith reduces a creature to 0 Hit Points, the dying creature's final breath tolls like a struck bell, and the bell wraith regains 6 (1d12) Hit Points; while a creature is below half its Hit Points, the bell wraith has Advantage on Wisdom (Perception) checks to hear it.","issue":"The trait is a single named trait bundling two unrelated mechanics (death-trigger heal and hearing advantage); the hearing clause creates an ongoing tracking state the GM must monitor without a clear condition of which creature."},{"id":"gate-h-hold-2026-11-11T22-40-27/01-gelatinous-cube.md/Engulf/93","run":"gate-h-hold-2026-11-11T22-40-27","sheet":"Gelatinous Cube","cr":"2","sec":"Actions","row":"Engulf (Recharge 5-6)","kind":"print","text":"Cube moves up to its Speed without provoking Opportunity Attacks. Cube can move through the spaces of Large or smaller creatures if it has room inside itself to contain them (see the Ooze Cube trait). *Dexterity Saving Throw*: DC 12, each creature whose space Cube enters for the first time during this move. *Failure:*  10 (3d6) Acid damage, and the target is engulfed. An engulfed target is suffocating, can't cast spells with a Verbal component, has the Restrained condition, and takes 10 (3d6) Acid damage at the start of each of Cube's turns. When Cube moves, the engulfed target moves with it. An engulfed target can try to escape by taking an action to make a DC 12 Strength (Athletics) check. On a successful check, the target escapes and enters the nearest unoccupied space. *Success:*  Half damage, and the target moves to an unoccupied space within 5 feet of Cube. If there is no unoccupied space, the target fails the save instead.","issue":"Two escape paths exist (the action-based DC 12 Athletics check and the Ooze Cube trait's pull-out), but the engulfed creature's own suffocation/Restrained condition has no stated repeat save or duration; suffocation outright kills with no save if the target cannot escape."},{"id":"gate-h-hold-2026-11-11T17-08-23/03-marsh-swallower.md/Bite/72","run":"gate-h-hold-2026-11-11T17-08-23","sheet":"Marsh Swallower","cr":"1","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +4, reach 5 ft. 6 (1d8 + 2) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 12). While Grappled, the target has the Restrained condition.","issue":"The Bite grapples a Large or smaller creature with no size gate below Large, permitting grapple of creatures larger than the swamp swallower's own Medium size without any adjudicable reach/positioning rule."},{"id":"probe-repair2-2026-11-10T14-46-14/09-daubjaw.md/Bite/123","run":"probe-repair2-2026-11-10T14-46-14","sheet":"Daubjaw","cr":"5","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +6, reach 5 ft. 16 (3d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14). While Grappled, the target has the Restrained condition. If the target is a creature and doesn't already have a chalk-daubed wound, it is subjected to the following effect. *Constitution Saving Throw*: DC 14. *Failure:* The target receives a chalk-daubed wound. While wounded, the target loses 5 (1d10) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, succeeding on a DC 14 Wisdom (Medicine) check.","issue":"The chalk-daubed wound has an escape route for the creature itself (action + Medicine check), but the listed stops are '1 minute', spell healing, or stanching — the ongoing HP loss has no repeat save and the stanch is a check, not a save, so the affected creature has only a skill-gated action; that is a legal counter but the wound persists on a creature whose only legal exits require another creature present or a spell."},{"id":"gate-h-hold-2026-11-11T20-20-08/05-crossing-lurker.md/Bite/80","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Crossing Lurker","cr":"2","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 7 (1d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"The 'while Grappled, Restrained' clause does not state scope, so the GM cannot tell whether it means only when grappled by this lurker or whenever grappled at all."},{"id":"gate-b-engulf-2026-11-11T02-19-26/02-blackrot-ooze.md/Pseudoapod/27","run":"gate-b-engulf-2026-11-11T02-19-26","sheet":"Blackrot Ooze","cr":"3","sec":"Actions","row":"Pseudoapod","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 12 (2d8 + 3) Slashing damage plus 9 (2d8) Acid damage. If the target is a creature and doesn't already have a tar-fouled wound, it is subjected to the following effect. *Constitution Saving Throw*: DC 13. *Failure:* The target receives a tar-fouled wound. While wounded, the target loses 5 (1d10) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, succeeding on a DC 13 Wisdom (Medicine) check.","issue":"The action and its wound effect are named for rot/tar ooze, but nothing in the block ever references a 'tar-fouled wound' elsewhere, and the name 'Pseudoapod' describes the limb rather than the effect, so the wound's rider is disconnected from any rot/tar entry."},{"id":"gate-h-hold-2026-11-11T15-23-20/01-sand-maw.md/Bite/62","run":"gate-h-hold-2026-11-11T15-23-20","sheet":"Sand Maw","cr":"9","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +11, reach 15 ft. 34 (6d8 + 7) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 19). While Grappled, the target has the Restrained condition.","issue":"The Grappled condition rider is applied explicitly but the Restrained-with-Grappled clause has no duration or end-condition distinct from the Grappled escape DC, and combined with Swallow the target can be Restrained twice from two sources."},{"id":"gate-h-hold-2026-11-11T05-44-38/02-tar-pool-ooze.md/Pseudopod/56","run":"gate-h-hold-2026-11-11T05-44-38","sheet":"Tar Pool Ooze","cr":"3","sec":"Actions","row":"Pseudopod","kind":"chassis","text":"*Melee Attack Roll:* +5, reach 5 ft. 7 (1d8 + 3) Bludgeoning damage plus 5 (1d10) Poison damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). While Grappled, the target has the Restrained condition.","issue":"The Grapple/Restrained rider includes no size limit matching the ooze's reach (a Large creature grappled at 5 ft. reach is fine, but the Restrained clause gives no exit beyond the escape DC — which is acceptable; however nothing is wrong mechanically here)."},{"id":"gate-h-hold-2026-11-11T17-08-23/10-cave-roper.md/Adhesive/74","run":"gate-h-hold-2026-11-11T17-08-23","sheet":"Cave Roper","cr":"5","sec":"Traits","row":"Adhesive","kind":"template","text":"The cave roper adheres to anything that touches it. A Huge or smaller creature adhered to the cave roper is also Grappled by it (escape DC 15). Ability checks made to escape this grapple have Disadvantage.","issue":"Adhesion is triggered by touching the roper, but 'anything that touches it' includes objects and creatures of any size; no size restriction governs the touch itself, and a creature that touches the roper through a natural weapon or unarmed strike has no stated way to avoid becoming adhered, so the Grappled condition can be imposed with no adjudicable trigger window."},{"id":"gate-h-hold-2026-11-11T17-08-23/03-marsh-swallower.md/Answering Sting/73","run":"gate-h-hold-2026-11-11T17-08-23","sheet":"Marsh Swallower","cr":"1","sec":"Bonus Actions","row":"Answering Sting","kind":"template","text":"One creature within 5 feet that hit the marsh swallower with an attack roll since the end of the marsh swallower's last turn takes 3 (1d6) Bludgeoning damage.","issue":"The trigger window references a creature that hit the swallower since the end of its last turn, but nothing on the block defines which creatures those are; the GM must reconstruct an off-turn hit history with no tracking cue, and it is unclear whether multiple eligible creatures let the swallower choose."},{"id":"probe-repair2-2026-11-10T08-37-15/03-chalk-hound.md/Bite/121","run":"probe-repair2-2026-11-10T08-37-15","sheet":"Chalk-Hound","cr":"5","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +6, reach 5 ft. 16 (3d8 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14). While Grappled, the target has the Restrained condition. If the target is a creature and doesn't already have a chalk-daubed wound, it is subjected to the following effect. *Constitution Saving Throw*: DC 14. *Failure:* The target receives a chalk-daubed wound. While wounded, the target loses 5 (1d10) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, succeeding on a DC 14 Wisdom (Medicine) check.","issue":"This clause silently prevents the wound from applying to a target already wounded, but doesn't specify whether a new Bite can re-apply the wound after it closes, which interacts ambiguously with the Swallow and Multiattack loop."},{"id":"gate-h-hold-2026-11-11T20-20-08/07-mire-hollow-troll.md/Regeneration/83","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Hollow Troll","cr":"5","sec":"Traits","row":"Regeneration","kind":"print","text":"The hollow troll regains 15 Hit Points at the start of each of its turns. If the hollow troll takes Acid or Fire damage, this trait doesn't function on the hollow troll's next turn. The hollow troll dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","issue":"This duplicates standard Troll Regeneration chassis text exactly, making it a redundant rules grant."},{"id":"sweep-2026-11-10T15-02-59/24-sump-scythe-horror.md/Swallow/134","run":"sweep-2026-11-10T15-02-59","sheet":"Sump Scythe Horror","cr":"9","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The scythe horror swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the scythe horror, and takes 10 (3d6) Acid damage at the start of each of the scythe horror's turns. The scythe horror can have only one creature swallowed at a time. If the scythe horror takes 25 damage or more on a single turn from the swallowed creature, the scythe horror must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 10 feet of the scythe horror. If the scythe horror dies, a swallowed creature exits the body Prone by using 10 feet of movement.","issue":"The clause assumes an unoccupied space within 10 feet and the horror's location, but gives no resolution if none exists and no timing relative to the horror's space — the GM has no defined fallback for an occupied horror."},{"id":"gate-h-hold-2026-11-11T20-20-08/03-mire-gulper.md/Swallow/78","run":"gate-h-hold-2026-11-11T20-20-08","sheet":"Mire Gulper","cr":"1","sec":"Bonus Actions","row":"Swallow","kind":"chassis","text":"The gulper swallows one Medium or smaller creature it is grappling. While swallowed, the target has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the gulper, and takes 3 (1d6) Acid damage at the start of each of the gulper's turns. The gulper can have only one creature swallowed at a time. If the gulper takes 5 damage or more in a single turn from the swallowed creature, the gulper must regurgitate the target at the end of that turn, and the target exits Prone in an unoccupied space within 5 feet of the gulper. If the gulper dies, a swallowed creature exits the body Prone by using 5 feet of movement.","issue":"The statblock's only grapple source is Bite, which grapples targets 'Large or smaller', but Swallow silently restricts to 'Medium or smaller' with no clause denying the creature anything it can grapple, leaving a Large grappled target with an indefinite grapple and no swallow and no stated limit."},{"id":"gate-b-engulf-2026-11-10T20-10-11/12-sand-maw.md/Bite/8","run":"gate-b-engulf-2026-11-10T20-10-11","sheet":"Sand-Maw","cr":"9","sec":"Actions","row":"Bite","kind":"chassis","text":"*Melee Attack Roll:* +11, reach
